        button { padding: 15px 30px; font-size: 20px; background: #000; color: #38bdf8; border: 2px solid #38bdf8; cursor: pointer; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #38bdf8; color: #000; box-shadow: 0 0 15px #38bdf8; }
        #status { margin-top: 20px; font-weight: bold; font-size: 18px; }
        .log-item { color: #555; font-size: 14px; margin: 5px 0; }
    </style>

                    { name: "أ. محمد صلاح", image: "https://i.postimg.cc/ZRJy8gDR/FB-IMG-1770382315133.jpg" },

                    { name: "مي مجدي", image: "https://i.postimg.cc/DzS7tcJs/FB-IMG-1770382635144.jpg" },

            // 3. الفيزياء
            {
                name: "الفيزياء",

                    { name: "دكتور كيرلس", image: "https://i.postimg.cc/qR0pD6nd/FB-IMG-1770383231786.jpg" },

                    { name: "أ. محمد عبدالجواد", image: "https://i.postimg.cc/rpR9ZKTR/c78ffbf64a791da67752132a9aaf7c8f127fc4f4.jpg" },
                    { name: "د. عبدالله حبشي", image: "https://i.postimg.cc/MGfY3vwV/hero_light.webp" },

            {
                name: "الإيطالي",
                image: "https://i.postimg.cc/VkX8S0fb/Hotels-near-the-Colosseum.jpg",
                teachers: [{ name: "سنيور مدحت", image: "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg" }]
            }
        ];

        async function startUpload() {
            const status = document.getElementById('status');
            const logs = document.getElementById('logs');
            status.innerText = "⏳ جاري الاتصال والرفع...";
            status.style.color = "blue";
            
            try {
                for (const sub of allData) {
                    // 1. إضافة المادة
                    const subRef = await db.collection('subjects').add({
                        name: sub.name,
                        image: sub.image
                    });
                    
                    logs.innerHTML += `<div class="log-item">✅ تم إضافة مادة: ${sub.name}</div>`;

                    for (const tech of sub.teachers) {
                        // 2. إضافة المدرس
                        const techRef = await db.collection('teachers').add({
                            subjectId: subRef.id,
                            name: tech.name,
                            image: tech.image
                        });

                        // 3. إضافة فولدر افتراضي لكل مدرس (عشان الشكل يكمل)
                        const folderRef = await db.collection('folders').add({
                            teacherId: techRef.id,
                            title: "أحدث الكورسات",
                            image: "https://cdn-icons-png.flaticon.com/512/3767/3767084.png"
                        });
                        
                        // 4. إضافة فيديو تجريبي داخل الفولدر
                        await db.collection('videos').add({
                            folderId: folderRef.id,
                            title: "فيديو ترحيبي",
                            vid: "dQw4w9WgXcQ", // فيديو يوتيوب تجريبي
                            desc: "فيديو تجريبي يمكن استبداله من لوحة التحكم"
                        });
                    }
                }
                status.innerText = "🎉 تم رفع جميع البيانات بنجاح! افتح المنصة الآن.";
                status.style.color = "green";
                alert("مبروك! المنصة جاهزة بالمحتوى.");
            } catch (error) {
                console.error(error);
                status.innerText = "❌ حدث خطأ: " + error.message;
                status.style.color = "red";
                alert("تأكد إنك فاتح الـ Rules في الفايربيز!");
            }
        }
    </script>
</body>
</html>
