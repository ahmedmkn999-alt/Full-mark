<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Mark | المنصة</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #050505; --card: #0f1015; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        /* الخلفية */
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        .container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(15, 16, 21, 0.95); border-bottom: 2px solid var(--main);
            padding: 15px 20px; border-radius: 20px; margin-bottom: 30px; 
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.15);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.6); }
        
        .header-icons { display: flex; gap: 10px; }
        .icon-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid #333; 
            background: #000; color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .icon-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); transform: scale(1.1); }
        .icon-btn.logout { border-color: #ff4444; color: #ff4444; }
        .icon-btn.logout:hover { background: #ff4444; color: #fff; box-shadow: 0 0 20px #ff4444; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; } }

        .card { 
            background: var(--card); border: 1px solid #222; border-radius: 20px; overflow: hidden; 
            position: relative; transition: 0.4s; cursor: pointer;
        }
        .card:hover { transform: translateY(-7px); border-color: var(--main); box-shadow: 0 0 25px rgba(0, 225, 255, 0.2); }
        
        .card-img-container { width: 100%; height: 180px; position: relative; background: #000; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; opacity: 0; } 
        .card-img.loaded { opacity: 1; }
        
        .img-fallback {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(45deg, #0f172a, #1e293b);
            color: var(--main); font-size: 3rem; font-weight: bold;
            text-align: center; padding: 10px;
        }

        .card-title { 
            padding: 15px; text-align: center; font-weight: 800; font-size: 1.1rem; 
            background: #0a0a0a; border-top: 1px solid #222; color: #fff;
        }

        /* الفيديو */
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .video-header { padding: 15px; background: #111; color: var(--main); font-weight: bold; text-align: center; }

        /* التنقل */
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { border-right: 5px solid var(--main); padding-right: 15px; font-size: 1.6rem; margin: 0; color: #fff; }
        #backBtn { display: none; background: #111; color: var(--main); border: 1px solid var(--main); padding: 8px 25px; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        #backBtn:hover { background: var(--main); color: #000; }
        
        /* المودال */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #0f1015; border: 1px solid var(--main); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; text-align: center; box-shadow: 0 0 50px rgba(0,225,255,0.2); }
        .close-btn { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; cursor: pointer; z-index: 10; }
        
        /* الشات */
        .chat-msgs { flex: 1; overflow-y: auto; padding: 10px; background: #050505; border: 1px solid #222; border-radius: 10px; margin-bottom: 10px; min-height: 200px; max-height: 300px; }
        .msg { padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; display: inline-block; max-width: 85%; font-size: 0.9rem; }
        .msg.me { background: var(--main); color: #000; float: left; clear: both; font-weight: bold; }
        .msg.support { background: #333; color: #fff; float: right; clear: both; }
        .chat-input { width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 50px; outline: none; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="container">
        <header>
            <div class="logo">FULL MARK</div>
            <div class="header-icons">
                <div class="icon-btn" onclick="openSupport()"><i class="fas fa-headset"></i></div>
                <div class="icon-btn" onclick="openProfile()"><i class="fas fa-user"></i></div>
                <div class="icon-btn logout" onclick="logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </header>

        <div class="nav-bar">
            <h2 id="pageTitle">المواد الدراسية</h2>
            <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
        </div>
        
        <div id="gridArea" class="grid"></div>
    </div>

    <div id="profileModal" class="modal-overlay">
        <div class="modal-box">
            <i class="fas fa-times close-btn" onclick="closeModal('profileModal')"></i>
            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" style="width:100px; border-radius:50%; border:3px solid var(--main); margin:0 auto 15px;">
            <h3 id="pName" style="color:#fff;">جاري التحميل...</h3>
            <div id="pCode" style="color:var(--main); font-family:monospace; font-size:1.2rem; margin:10px 0;">...</div>
            <p id="pExp" style="color:#888; font-size:0.9rem;">...</p>
        </div>
    </div>

    <div id="supportModal" class="modal-overlay">
        <div class="modal-box" style="height: 500px;">
            <i class="fas fa-times close-btn" onclick="closeModal('supportModal')"></i>
            <h3 style="color:var(--main); margin-bottom:15px;">الدعم الفني</h3>
            <div class="chat-msgs" id="chatBody">
                <div style="text-align:center; color:#555; margin-top:50px;">كيف يمكننا مساعدتك؟</div>
            </div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك...">
                <button onclick="sendMsg()" style="width:45px; height:45px; border-radius:50%; background:var(--main); border:none; cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

                ]
            },

                    { name: "محمد أيمن", image_url: "https://i.postimg.cc/856NCBS7/profile_433b1d2b5e7bfd30bed5.png", chapters: [] },

                teachers: [
                    { name: "أحمد عصام", image_url: "https://i.postimg.cc/fyRCK5RJ/essam_dark.png", chapters: [{chapter_name: "الديناميكا", lectures:[{lecture_name:"المحاضرة 1", videos:[{video_name:"الحصة الأولى", links:[{url:"https://river-3-379.rtbcdn.ru/hls-vod/06STGPfnWguOTNuFlMZgMQ/1770751943/2618/0x5000039ce868e9d9/22b8200bea934ba5a9dd9774119704a2.mp4.m3u8"}]}]}]}] },
                    { name: "لطفي زهران", image_url: "https://i.postimg.cc/sXywB3Fh/Lotfy_a940b4e08c6abf7a6821.png", chapters: [{chapter_name: "معسكر الفراغية", lectures:[{lecture_name:"شرح", videos:[{video_name:"شرح الفراغية", links:[{url:"https://river-3-343.rtbcdn.ru/hls-vod/q2gpG37FzyJ0GlwCyYCAxg/1770654567/3290/0x5000c500fa6e36fa/b184d50653474fb4b3c5e2dd9e391798.mp4.m3u8"}]}]}]}] }
                ]
            },
            // اللغات الثانية
            {

                image_url: "https://i.postimg.cc/NjRcy2s0/a75e136b-7909-485f-95e8-862fddd2c0bc.png",
                teachers: [{ name: "مسيو انس السعيد", image_url: "https://i.postimg.cc/sDdy3JyV/lhctmi-Qt-ANEg0PDcec-CE1QTCqr-Kza-Eq-GZ6s-Zt-MJ4.jpg", chapters: [{chapter_name: "شرح المنهج", lectures:[{lecture_name:"3 ثانوي", videos:[{video_name:"الجزء 1", links:[{url:"https://www.youtube.com/watch?v=3PC1fxpp-Xk"}]}]}]}] }]
            },

            },
            {
                subject_name: "لغة إيطالية",
                image_url: "https://i.postimg.cc/VkX8S0fb/Hotels-near-the-Colosseum.jpg",
                teachers: [{ name: "سنيور مدحت", image_url: "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg", chapters: [{chapter_name: "مراجعة", lectures:[{lecture_name:"شامل", videos:[{video_name:"المنهج كامل", links:[{url:"https://www.youtube.com/watch?v=T6hpZH5AMnk"}]}]}]}] }]
            },
            {
                subject_name: "لغة إسبانية",
                image_url: "https://i.postimg.cc/L8jpqg95/250px-Flag-of-Spain-svg.png",
                teachers: [{ name: "سنيور ماجد", image_url: "https://i.postimg.cc/jdbVpdQ5/FB-IMG-1770239115997.jpg", chapters: [{chapter_name: "مراجعة", lectures:[{lecture_name:"شامل", videos:[{video_name:"شرح كامل", links:[{url:"https://www.youtube.com/watch?v=K9ZOydc1cqs"}]}]}]}] }]
            }
        ];

        // 4. منطق التطبيق
        const userCode = localStorage.getItem('fullmark_user');
        if(!userCode) window.location.href = "login.html";

        const grid = document.getElementById('gridArea');
        const title = document.getElementById('pageTitle');
        const back = document.getElementById('backBtn');
        let viewStack = [];

        function createCard(title, imgUrl, onclickFn, icon) {
            return `
            <div class="card" onclick="${onclickFn}">
                <div class="card-img-container">
                    <div class="img-fallback"><i class="fas ${icon}"></i></div>
                    <img src="${imgUrl}" class="card-img" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
                </div>
                <div class="card-title">${title}</div>
            </div>`;
        }

        function renderSubjects() {
            title.innerText = "المواد الدراسية";
            back.style.display = 'none';
            grid.className = 'grid';
            viewStack = [{type: 'subjects'}];
            grid.innerHTML = ALL_DATA.map((sub, i) => createCard(sub.subject_name, sub.image_url, `renderTeachers(${i})`, 'fa-book')).join('');
        }

        function renderTeachers(subIdx) {
            const sub = ALL_DATA[subIdx];
            title.innerText = sub.subject_name;
            back.style.display = 'block';
            viewStack.push({type: 'teachers', subIdx});
            if(!sub.teachers || sub.teachers.length===0) { grid.innerHTML='<p style="text-align:center; color:#777; width:100%">قريباً</p>'; return; }
            grid.innerHTML = sub.teachers.map((t, i) => createCard(t.name, t.image_url, `renderChapters(${subIdx}, ${i})`, 'fa-user-tie')).join('');
        }

        function renderChapters(subIdx, techIdx) {
            const teacher = ALL_DATA[subIdx].teachers[techIdx];
            title.innerText = teacher.name;
            viewStack.push({type: 'chapters', subIdx, techIdx});
            if(!teacher.chapters || teacher.chapters.length===0) { grid.innerHTML='<p style="text-align:center; color:#777; width:100%">لا يوجد محتوى</p>'; return; }
            grid.innerHTML = teacher.chapters.map((c, i) => createCard(c.chapter_name, '', `renderLectures(${subIdx}, ${techIdx}, ${i})`, 'fa-folder')).join('');
        }

        function renderLectures(subIdx, techIdx, chapIdx) {
            const chapter = ALL_DATA[subIdx].teachers[techIdx].chapters[chapIdx];
            title.innerText = chapter.chapter_name;
            viewStack.push({type: 'lectures', subIdx, techIdx, chapIdx});
            grid.innerHTML = chapter.lectures.map((l, i) => createCard(l.lecture_name, '', `renderVideos(${subIdx}, ${techIdx}, ${chapIdx}, ${i})`, 'fa-video')).join('');
        }

        function renderVideos(subIdx, techIdx, chapIdx, lectIdx) {
            const lecture = ALL_DATA[subIdx].teachers[techIdx].chapters[chapIdx].lectures[lectIdx];
            title.innerText = lecture.lecture_name;
            grid.className = '';
            viewStack.push({type: 'videos'});
            grid.innerHTML = lecture.videos.map((v, i) => `
                <div class="video-wrapper">
                    <div class="video-header">${v.video_name}</div>
                    <div class="plyr__video-embed" id="player-wrap-${i}">
                        <video id="player-${i}" controls crossorigin playsinline style="width:100%"></video>
                    </div>
                </div>
            `).join('');

            setTimeout(() => {
                lecture.videos.forEach((v, i) => {
                    const video = document.getElementById(`player-${i}`);
                    const source = v.links[0].url;
                    if(source.includes('youtube')) {
                        document.getElementById(`player-wrap-${i}`).innerHTML = `<iframe src="https://www.youtube.com/embed/${source.split('v=')[1]}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>`;
                    } else if(Hls.isSupported()) {
                        const hls = new Hls(); hls.loadSource(source); hls.attachMedia(video); new Plyr(video);
                    } else {
                        video.src = source; new Plyr(video);
                    }
                });
            }, 100);
        }

        function goBack() {
            viewStack.pop();
            const prev = viewStack[viewStack.length-1];
            if(prev.type === 'subjects') renderSubjects();
            else if(prev.type === 'teachers') renderTeachers(prev.subIdx);
            else if(prev.type === 'chapters') renderChapters(prev.subIdx, prev.techIdx);
            else if(prev.type === 'lectures') renderLectures(prev.subIdx, prev.techIdx, prev.chapIdx);
        }

        // --- المودال ---
        function openModal(id) { document.getElementById(id).style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function openProfile() { openModal('profileModal'); db.collection('codes').where('code','==',userCode).get().then(snap => { if(!snap.empty){const d=snap.docs[0].data(); document.getElementById('pName').innerText=d.studentName; document.getElementById('pCode').innerText=d.code; document.getElementById('pExp').innerText="ينتهي: "+d.expiresAt.toDate().toLocaleDateString('ar-EG');} }); }
        function openSupport() { openModal('supportModal'); loadChat(); }
        function sendMsg() { const t=document.getElementById('chatInput').value; if(!t)return; db.collection('support').doc(userCode).collection('messages').add({text:t, sender:'me', createdAt:firebase.firestore.FieldValue.serverTimestamp()}); document.getElementById('chatInput').value=''; }
        function loadChat() { const b=document.getElementById('chatBody'); db.collection('support').doc(userCode).collection('messages').orderBy('createdAt').onSnapshot(snap => { b.innerHTML=''; snap.forEach(d=>{const m=d.data(); b.innerHTML+=`<div style="overflow:hidden; width:100%"><div class="msg ${m.sender}">${m.text}</div></div>`}); b.scrollTop=b.scrollHeight; }); }
        function logout() { localStorage.removeItem('fullmark_user'); window.location.href="login.html"; }

        // Start
        renderSubjects();
    </script>
</body>
</html>
