<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Full Mark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 1000px; margin-top: 30px; padding-bottom: 80px; }
        .card-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .badge-active { background-color: #dcfce7; color: #166534; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .badge-expired { background-color: #fee2e2; color: #991b1b; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .badge-banned { background-color: #f3f4f6; color: #1f2937; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .copy-btn { cursor: pointer; color: #2563eb; transition: 0.2s; }
        .copy-btn:hover { color: #1d4ed8; transform: scale(1.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="fas fa-users-cog"></i> لوحة التحكم</h2>
        <a href="index.html" class="btn btn-outline-secondary">الذهاب للمنصة</a>
    </div>

    <div class="card-box border-primary border-2">
        <h4 class="mb-3"><i class="fas fa-key"></i> توليد كود طالب</h4>
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label fw-bold">اسم الطالب</label>
                <input type="text" id="studentName" class="form-control" placeholder="اسم الطالب رباعي">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">المدة</label>
                <select id="duration" class="form-select">
                    <option value="1h">ساعة (تجريبي)</option>
                    <option value="1m" selected>شهر كامل</option>
                </select>
            </div>
            <div class="col-md-4">
                <button onclick="generateCode()" class="btn btn-primary w-100 fw-bold py-2">توليد ونسخ الكود</button>
            </div>
        </div>
    </div>

    <div class="card-box">
        <h4 class="mb-3"><i class="fas fa-plus-circle"></i> إضافة محتوى (مواد/مدرسين)</h4>
        
        <div class="row g-2 mb-3 align-items-end">
            <div class="col-5"><input type="text" id="subName" class="form-control" placeholder="اسم المادة (عربي/فرنساوي..)"></div>
            <div class="col-5"><input type="text" id="subImg" class="form-control" placeholder="رابط صورة المادة"></div>
            <div class="col-2"><button onclick="addSubject()" class="btn btn-success w-100">إضافة مادة</button></div>
        </div>
        <hr>
        <div class="row g-2 mb-3 align-items-end">
            <div class="col-3"><select id="selSubjectForTeacher" class="form-select"><option>اختر المادة</option></select></div>
            <div class="col-3"><input type="text" id="techName" class="form-control" placeholder="اسم المدرس"></div>
            <div class="col-4"><input type="text" id="techImg" class="form-control" placeholder="رابط صورة المدرس"></div>
            <div class="col-2"><button onclick="addTeacher()" class="btn btn-success w-100">إضافة مدرس</button></div>
        </div>
    </div>

    <div class="card-box">
        <h4 class="mb-3 text-success">الأكواد النشطة</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle"><thead class="table-light"><tr><th>الطالب</th><th>الكود</th><th>ينتهي في</th><th>إجراء</th></tr></thead><tbody id="activeTableBody"></tbody></table>
        </div>
    </div>
    
    <div class="card-box">
        <h4 class="mb-3 text-danger">الأرشيف (منتهي/محظور)</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle"><thead class="table-light"><tr><th>الطالب</th><th>الكود</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="archiveTableBody"></tbody></table>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds",
      authDomain: "full-mark-8d434.firebaseapp.com",
      projectId: "full-mark-8d434",
      storageBucket: "full-mark-8d434.firebasestorage.app",
      messagingSenderId: "802579483999",
      appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.onload = function() { loadCodes(); loadSubjects(); };

    // --- إدارة الأكواد ---
    function generateCode() {
        const name = document.getElementById('studentName').value;
        const duration = document.getElementById('duration').value;
        if(!name) return alert("اكتب اسم الطالب");
        const code = 'STD-' + Math.floor(1000 + Math.random() * 9000);
        let expiresAt = new Date();
        if(duration === '1h') expiresAt.setHours(expiresAt.getHours() + 1);
        else expiresAt.setMonth(expiresAt.getMonth() + 1);

        db.collection('codes').add({
            studentName: name, code: code, status: 'active',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(), expiresAt: expiresAt
        }).then(() => {
            navigator.clipboard.writeText(code);
            alert(`تم نسخ الكود: ${code}`);
            document.getElementById('studentName').value = '';
        });
    }

    function loadCodes() {
        db.collection('codes').orderBy('createdAt', 'desc').onSnapshot(snap => {
            document.getElementById('activeTableBody').innerHTML = '';
            document.getElementById('archiveTableBody').innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                const now = new Date();
                const exp = d.expiresAt ? d.expiresAt.toDate() : new Date();
                if(d.status === 'active' && now > exp) db.collection('codes').doc(doc.id).update({status: 'expired'});
                
                const row = `<tr><td>${d.studentName}</td><td>${d.code} <i class="fas fa-copy copy-btn" onclick="navigator.clipboard.writeText('${d.code}')"></i></td>
                <td>${d.status === 'active' ? exp.toLocaleDateString('ar-EG') : `<span class="badge-${d.status}">${d.status}</span>`}</td>
                <td>${d.status === 'active' ? `<button class="btn btn-sm btn-danger" onclick="setStatus('${doc.id}','banned')">حظر</button>` : 
                `<button class="btn btn-sm btn-success" onclick="renew('${doc.id}')">تجديد</button> <button class="btn btn-sm btn-outline-danger" onclick="del('${doc.id}')">حذف</button>`}</td></tr>`;
                
                if(d.status === 'active') document.getElementById('activeTableBody').innerHTML += row;
                else document.getElementById('archiveTableBody').innerHTML += row;
            });
        });
    }
    
    function setStatus(id, st) { if(confirm('تأكيد؟')) db.collection('codes').doc(id).update({status: st}); }
    function del(id) { if(confirm('حذف نهائي؟')) db.collection('codes').doc(id).delete(); }
    function renew(id) { 
        const exp = new Date(); exp.setMonth(exp.getMonth()+1);
        db.collection('codes').doc(id).update({status: 'active', expiresAt: exp}); 
    }

    // --- إدارة المحتوى ---
    function addSubject() {
        db.collection('subjects').add({
            name: document.getElementById('subName').value, image: document.getElementById('subImg').value
        }).then(() => { alert('تمت إضافة المادة'); loadSubjects(); });
    }
    function addTeacher() {
        db.collection('teachers').add({
            subjectId: document.getElementById('selSubjectForTeacher').value,
            name: document.getElementById('techName').value, image: document.getElementById('techImg').value
        }).then(() => alert('تمت إضافة المدرس'));
    }
    function loadSubjects() {
        db.collection('subjects').get().then(snap => {
            let html = '<option>اختر المادة</option>';
            snap.forEach(doc => html += `<option value="${doc.id}">${doc.data().name}</option>`);
            if(document.getElementById('selSubjectForTeacher')) document.getElementById('selSubjectForTeacher').innerHTML = html;
        });
    }
</script>
</body>
</html>
