<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأكواد | Full Mark</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 1000px; margin-top: 30px; padding-bottom: 80px; }
        .card-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .badge-active { background-color: #dcfce7; color: #166534; padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .badge-expired { background-color: #fee2e2; color: #991b1b; padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .badge-banned { background-color: #f3f4f6; color: #1f2937; padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .copy-btn { cursor: pointer; color: #2563eb; transition: 0.2s; }
        .copy-btn:hover { color: #1d4ed8; transform: scale(1.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="fas fa-users-cog"></i> مدير الأكواد والطلاب</h2>
        <a href="index.html" class="btn btn-outline-secondary">الذهاب للمنصة</a>
    </div>

    <div class="card-box border-primary border-2">
        <h4 class="mb-3"><i class="fas fa-plus-circle"></i> توليد كود جديد</h4>
        <div class="row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label fw-bold">اسم الطالب</label>
                <input type="text" id="studentName" class="form-control" placeholder="اسم الطالب رباعي">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold">مدة الاشتراك</label>
                <select id="duration" class="form-select">
                    <option value="1h">ساعة واحدة (تجريبي)</option>
                    <option value="1m" selected>شهر كامل</option>
                </select>
            </div>
            <div class="col-md-4">
                <button onclick="generateCode()" class="btn btn-primary w-100 fw-bold py-2">
                    <i class="fas fa-magic"></i> توليد ونسخ الكود
                </button>
            </div>
        </div>
    </div>

    <div class="card-box">
        <h4 class="mb-3 text-success"><i class="fas fa-check-circle"></i> الأكواد النشطة (Active)</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>الطالب</th>
                        <th>الكود</th>
                        <th>ينتهي في</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="activeTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="card-box">
        <h4 class="mb-3 text-danger"><i class="fas fa-archive"></i> الأرشيف (منتهي / محظور)</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>الطالب</th>
                        <th>الكود</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="archiveTableBody">
                    </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
    // نفس إعداداتك بالظبط
    const firebaseConfig = {
      apiKey: "AIzaSyD0Yq1TCIkjCzDJuzbWCA6XNDC4REsIJ84",
      authDomain: "full-mark-2878d.firebaseapp.com",
      projectId: "full-mark-2878d",
      storageBucket: "full-mark-2878d.firebasestorage.app",
      messagingSenderId: "793615165668",
      appId: "1:793615165668:web:b5e0cde21901ff060d24f1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // تشغيل المستمع للبيانات (Realtime)
    window.onload = function() {
        loadCodes();
    };

    // 1. دالة توليد الكود
    function generateCode() {
        const name = document.getElementById('studentName').value;
        const duration = document.getElementById('duration').value;

        if(!name) return alert("اكتب اسم الطالب الأول!");

        // إنشاء كود عشوائي
        const randomCode = 'STD-' + Math.floor(1000 + Math.random() * 9000);

        // حساب تاريخ الانتهاء
        let expiresAt = new Date();
        if(duration === '1h') expiresAt.setHours(expiresAt.getHours() + 1);
        else if(duration === '1m') expiresAt.setMonth(expiresAt.getMonth() + 1);

        db.collection('codes').add({
            studentName: name,
            code: randomCode,
            status: 'active', // active, expired, banned
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            expiresAt: expiresAt
        }).then(() => {
            // نسخ الكود للحافظة
            navigator.clipboard.writeText(randomCode);
            alert(`تم نسخ الكود: ${randomCode}\nللطالب: ${name}`);
            document.getElementById('studentName').value = '';
        });
    }

    // 2. تحميل وعرض الأكواد
    function loadCodes() {
        db.collection('codes').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            const activeBody = document.getElementById('activeTableBody');
            const archiveBody = document.getElementById('archiveTableBody');
            
            activeBody.innerHTML = '';
            archiveBody.innerHTML = '';

            snapshot.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                
                // التأكد من التاريخ (هل انتهى؟)
                const now = new Date();
                const expiryDate = d.expiresAt ? d.expiresAt.toDate() : new Date();
                let status = d.status;

                // لو الوقت عدى وهو لسه active، حوله expired أوتوماتيك
                if (status === 'active' && now > expiryDate) {
                    status = 'expired';
                    db.collection('codes').doc(id).update({ status: 'expired' });
                }

                // تنسيق التاريخ للعرض
                const dateStr = expiryDate.toLocaleString('ar-EG');

                if (status === 'active') {
                    activeBody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${d.studentName}</td>
                            <td>${d.code} <i class="fas fa-copy copy-btn ms-2" onclick="copy('${d.code}')"></i></td>
                            <td>${dateStr}</td>
                            <td>
                                <button class="btn btn-sm btn-danger" onclick="changeStatus('${id}', 'banned')">حظر</button>
                            </td>
                        </tr>
                    `;
                } else {
                    const badgeClass = status === 'banned' ? 'badge-banned' : 'badge-expired';
                    const statusText = status === 'banned' ? 'محظور' : 'منتهي الصلاحية';
                    
                    archiveBody.innerHTML += `
                        <tr>
                            <td>${d.studentName}</td>
                            <td>${d.code}</td>
                            <td><span class="${badgeClass}">${statusText}</span></td>
                            <td>
                                <button class="btn btn-sm btn-success" onclick="renewCode('${id}')">تجديد شهر</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteCode('${id}')">حذف</button>
                            </td>
                        </tr>
                    `;
                }
            });
        });
    }

    // 3. تغيير الحالة (حظر)
    function changeStatus(id, newStatus) {
        if(confirm('هل أنت متأكد؟')) {
            db.collection('codes').doc(id).update({ status: newStatus });
        }
    }

    // 4. تجديد الكود (تجديد شهر من الآن)
    function renewCode(id) {
        const newExpiry = new Date();
        newExpiry.setMonth(newExpiry.getMonth() + 1);
        
        db.collection('codes').doc(id).update({
            status: 'active',
            expiresAt: newExpiry
        });
    }

    // 5. حذف نهائي
    function deleteCode(id) {
        if(confirm('حذف نهائي؟ لن يتمكن الطالب من الدخول بهذا الكود مجدداً.')) {
            db.collection('codes').doc(id).delete();
        }
    }

    // نسخ الكود يدوي
    function copy(text) {
        navigator.clipboard.writeText(text);
        alert('تم النسخ: ' + text);
    }

</script>
</body>
</html>
