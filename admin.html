<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #050505; --panel: #111; --text: #fff; --danger: #ff3333; --success: #00ff88; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        
        /* القائمة الجانبية */
        .sidebar {
            width: 250px; background: #0a0a0a; border-left: 1px solid #222;
            padding: 20px; display: flex; flex-direction: column;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
        }
        .admin-logo { font-size: 1.8rem; font-weight: 900; color: var(--main); margin-bottom: 40px; text-align: center; letter-spacing: 1px; }
        .menu-item {
            padding: 15px; margin-bottom: 10px; border-radius: 10px; cursor: pointer;
            transition: 0.3s; color: #888; font-weight: bold; display: flex; align-items: center; gap: 10px;
        }
        .menu-item:hover, .menu-item.active { background: rgba(0, 225, 255, 0.1); color: var(--main); }
        .menu-item i { width: 25px; }

        /* المحتوى الرئيسي */
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h2 { font-size: 2rem; }
        .live-badge { background: rgba(255,0,0,0.2); color: red; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .live-dot { width: 8px; height: 8px; background: red; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* كروت الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card {
            background: var(--panel); border: 1px solid #222; border-radius: 20px; padding: 25px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--main); }
        .stat-info h3 { font-size: 2.5rem; margin-bottom: 5px; color: #fff; }
        .stat-info p { color: #888; font-size: 0.9rem; }
        .stat-icon { font-size: 2.5rem; color: var(--main); opacity: 0.8; }

        /* قسم التحكم */
        .panel-section { background: var(--panel); border-radius: 20px; padding: 30px; margin-bottom: 30px; border: 1px solid #222; }
        .section-header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        
        /* المدخلات والأزرار */
        .control-group { display: flex; gap: 10px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 15px; }
        input, select {
            background: #050505; border: 1px solid #333; color: #fff;
            padding: 12px; border-radius: 10px; outline: none; flex: 1; font-family: 'Cairo';
        }
        .btn { padding: 12px 30px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--main); color: #000; }
        .btn-primary:hover { box-shadow: 0 0 15px var(--main); }
        .btn-danger { background: rgba(255, 51, 51, 0.2); color: var(--danger); border: 1px solid var(--danger); padding: 5px 15px; font-size: 0.8rem; }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        /* الجدول */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; color: #888; padding: 15px; border-bottom: 1px solid #333; }
        td { padding: 15px; border-bottom: 1px solid #222; }
        tr:hover td { background: #161616; }
        
        .status-active { color: var(--success); background: rgba(0, 255, 136, 0.1); padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; }
        .status-expired { color: var(--danger); background: rgba(255, 51, 51, 0.1); padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="admin-logo">ADMIN PANEL</div>
        <div class="menu-item active"><i class="fas fa-chart-pie"></i> لوحة التحكم</div>
        <div class="menu-item"><i class="fas fa-users"></i> الطلاب</div>
        <div class="menu-item"><i class="fas fa-headset"></i> الدعم الفني</div>
        <div class="menu-item" style="margin-top:auto; color:var(--danger);" onclick="window.location.href='login.html'"><i class="fas fa-sign-out-alt"></i> خروج</div>
    </div>

    <div class="content">
        <div class="header">
            <div>
                <h2>أهلاً يا هندسة 👋</h2>
                <p style="color:#888;">إليك نظرة عامة على المنصة اليوم</p>
            </div>
            <div class="live-badge"><div class="live-dot"></div> Live System</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info"><h3 id="totalCount">0</h3><p>إجمالي الطلاب</p></div>
                <div class="stat-icon"><i class="fas fa-user-graduate"></i></div>
            </div>
            <div class="stat-card" style="border-color: var(--success);">
                <div class="stat-info"><h3 id="activeCount" style="color:var(--success)">0</h3><p>اشتراكات نشطة</p></div>
                <div class="stat-icon" style="color:var(--success)"><i class="fas fa-check-circle"></i></div>
            </div>
            <div class="stat-card" style="border-color: var(--danger);">
                <div class="stat-info"><h3 id="expiredCount" style="color:var(--danger)">0</h3><p>اشتراكات منتهية</p></div>
                <div class="stat-icon" style="color:var(--danger)"><i class="fas fa-times-circle"></i></div>
            </div>
        </div>

        <div class="panel-section">
            <div class="section-header">
                <h3><i class="fas fa-key" style="color:var(--main); margin-left:10px;"></i> توليد كود جديد</h3>
            </div>
            <div class="control-group">
                <input type="text" id="stdName" placeholder="اسم الطالب رباعي">
                <select id="duration">
                    <option value="1">شهر واحد</option>
                    <option value="3">3 شهور</option>
                    <option value="12">سنة كاملة</option>
                </select>
                <button class="btn btn-primary" onclick="generateCode()">إنشاء كود</button>
            </div>
            <div id="newCodeDisplay" style="display:none; background:#000; padding:15px; border:1px dashed var(--success); color:var(--success); text-align:center; border-radius:10px; font-size:1.2rem;">
                تم إنشاء الكود: <span id="theCode" style="font-family:monospace; font-weight:bold; color:#fff;"></span>
            </div>
        </div>

        <div class="panel-section">
            <div class="section-header">
                <h3><i class="fas fa-list" style="color:var(--main); margin-left:10px;"></i> سجل الطلاب</h3>
                <button class="btn" style="background:#222; color:#fff; font-size:0.8rem;" onclick="loadStudents()"><i class="fas fa-sync"></i> تحديث</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>الطالب</th>
                            <th>الكود</th>
                            <th>تاريخ الانتهاء</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTable">
                        <tr><td colspan="5" style="text-align:center;">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // 1. توليد كود
        function generateCode() {
            const name = document.getElementById('stdName').value;
            const months = parseInt(document.getElementById('duration').value);
            if(!name) return alert('اكتب اسم الطالب');

            const code = 'STD-' + Math.floor(100000 + Math.random() * 900000); // 6 digits
            let expDate = new Date();
            expDate.setMonth(expDate.getMonth() + months);

            db.collection('codes').add({
                studentName: name,
                code: code,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                expiresAt: expDate
            }).then(() => {
                document.getElementById('newCodeDisplay').style.display = 'block';
                document.getElementById('theCode').innerText = code;
                document.getElementById('stdName').value = '';
                // نسخ الكود تلقائي
                navigator.clipboard.writeText(code);
                alert("تم نسخ الكود: " + code);
            });
        }

        // 2. تحميل الطلاب والاحصائيات
        function loadStudents() {
            db.collection('codes').orderBy('createdAt', 'desc').onSnapshot(snap => {
                const tbody = document.getElementById('studentsTable');
                tbody.innerHTML = '';
                
                let total = 0;
                let active = 0;
                let expired = 0;
                const now = new Date();

                snap.forEach(doc => {
                    const d = doc.data();
                    const exp = d.expiresAt.toDate();
                    const isActive = exp > now;
                    
                    total++;
                    if(isActive) active++; else expired++;

                    const row = `
                        <tr>
                            <td style="font-weight:bold; color:#fff;">${d.studentName}</td>
                            <td style="font-family:monospace; color:var(--main);">${d.code}</td>
                            <td>${exp.toLocaleDateString('ar-EG')}</td>
                            <td><span class="${isActive ? 'status-active' : 'status-expired'}">${isActive ? 'نشط' : 'منتهي'}</span></td>
                            <td><button class="btn btn-danger" onclick="deleteUser('${doc.id}')"><i class="fas fa-trash"></i></button></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                document.getElementById('totalCount').innerText = total;
                document.getElementById('activeCount').innerText = active;
                document.getElementById('expiredCount').innerText = expired;
            });
        }

        // 3. حذف طالب
        function deleteUser(id) {
            if(confirm("هل أنت متأكد من حذف هذا الطالب؟ لا يمكن التراجع.")) {
                db.collection('codes').doc(id).delete();
            }
        }

        // تشغيل عند البدء
        loadStudents();
    </script>
</body>
</html>
