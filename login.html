<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Full Mark</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; font-family: 'Cairo', sans-serif; overflow: hidden; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #001a1f 0%, #000 90%); z-index: -1; }
        .login-box { background: rgba(10, 10, 15, 0.9); border: 2px solid #00e1ff; padding: 40px 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 50px rgba(0,225,255,0.2); }
        h1 { color: #00e1ff; font-size: 2.5rem; margin-bottom: 30px; text-transform: uppercase; text-shadow: 0 0 20px rgba(0,225,255,0.5); }
        input { width: 100%; padding: 15px; background: #111; border: 1px solid #333; border-radius: 50px; color: #fff; font-size: 1.2rem; text-align: center; outline: none; margin-bottom: 20px; font-family: 'Cairo'; }
        input:focus { border-color: #00e1ff; box-shadow: 0 0 15px rgba(0,225,255,0.3); }
        button { width: 100%; padding: 15px; background: #00e1ff; color: #000; border: none; border-radius: 50px; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px #00e1ff; transform: scale(1.05); }
        .error { color: #ff3333; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="login-box">
        <h1>FULL MARK</h1>
        <input type="text" id="code" placeholder="أدخل كود الطالب">
        <button onclick="login()">دخول</button>
        <p id="error" class="error">الكود غير صحيح</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        function login() {
            const code = document.getElementById('code').value.trim();
            const btn = document.querySelector('button');
            const err = document.getElementById('error');

            if(!code) return;
            
            btn.innerHTML = 'جاري التحقق...';
            
            // بحث سريع في قاعدة البيانات
            db.collection('codes').where('code', '==', code).get().then(snap => {
                if(snap.empty) {
                    // لو الكود مش موجود (للتجربة خليه يدخل برضه بس ينبهك)
                    // في الوضع الطبيعي المفروض نمنعه، بس هنا عشان نتأكد إن المشكلة مش في الداتا بيز
                    saveAndGo(code, "طالب تجريبي"); 
                } else {
                    const data = snap.docs[0].data();
                    saveAndGo(data.code, data.studentName);
                }
            }).catch(e => {
                // لو في مشكلة في النت، هندخله برضه عشان نجرب الموقع
                saveAndGo(code, "وضع الاوفلاين");
            });
        }

        function saveAndGo(code, name) {
            localStorage.setItem('fullmark_user', code);
            localStorage.setItem('fullmark_name', name); // حفظنا الاسم كمان احتياطي
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
