<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Full Mark</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a; color: white;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .login-box {
            background: #1e293b; padding: 40px; border-radius: 16px;
            text-align: center; width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155;
        }
        input {
            width: 85%; padding: 14px; margin: 20px 0; border-radius: 10px;
            border: 1px solid #475569; background: #0f172a; color: white;
            font-size: 18px; text-align: center; outline: none;
        }
        button {
            width: 93%; padding: 14px; background: #2563eb; color: white;
            border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        button:hover { background: #1d4ed8; }
        #errorMsg { color: #ef4444; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <p style="color:#94a3b8">أدخل الكود الخاص بك</p>
        <input type="text" id="studentCode" placeholder="Code Here">
        <button onclick="login()">دخول</button>
        <div id="errorMsg">الكود غير صحيح!</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD0Yq1TCIkjCzDJuzbWCA6XNDC4REsIJ84",
          authDomain: "full-mark-2878d.firebaseapp.com",
          projectId: "full-mark-2878d",
          storageBucket: "full-mark-2878d.firebasestorage.app",
          messagingSenderId: "793615165668",
          appId: "1:793615165668:web:b5e0cde21901ff060d24f1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function login() {
            const code = document.getElementById('studentCode').value.trim();
            if(!code) return;
            document.querySelector('button').innerText = "جاري التحقق...";
            
            db.collection('codes').where('code', '==', code).get().then(snap => {
                if(!snap.empty) {
                    localStorage.setItem('fullmark_user', code);
                    window.location.href = "index.html";
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                    document.querySelector('button').innerText = "دخول";
                }
            });
        }
    </script>
</body>
</html>
