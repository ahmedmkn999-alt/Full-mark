<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | FULL MARK</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #000000; /* أسود صريح */
            overflow: hidden; height: 100vh;
            display: flex; justify-content: center; align-items: center; position: relative;
        }

        /* شبكة زرقاء خفيفة في الخلفية */
        #particles-js {
            position: absolute; width: 100%; height: 100%; z-index: 1;
            background: radial-gradient(circle, rgba(0,225,255,0.05) 0%, rgba(0,0,0,1) 70%);
        }

        .login-container { position: relative; z-index: 10; text-align: center; width: 90%; max-width: 400px; padding: 20px; }

        /* الاسم أزرق تلجي */
        .brand-title {
            font-size: 4rem; font-weight: 900;
            color: #00e1ff; /* أزرق تلجي */
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 225, 255, 0.6), 0 0 40px rgba(0, 225, 255, 0.3);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .glass-box {
            background: rgba(10, 10, 10, 0.8); /* أسود شفاف */
            border: 1px solid rgba(0, 225, 255, 0.3);
            border-radius: 20px; padding: 40px 30px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        input {
            width: 100%; padding: 15px; margin-bottom: 25px;
            background: #000; border: 1px solid #333;
            border-radius: 12px; color: #00e1ff; font-size: 1.2rem; text-align: center; outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        input:focus { border-color: #00e1ff; box-shadow: 0 0 15px rgba(0, 225, 255, 0.3); }

        button {
            width: 100%; padding: 15px;
            background: #00e1ff; color: #000;
            border: none; border-radius: 12px;
            font-size: 1.2rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 225, 255, 0.4);
            transition: 0.3s;
        }
        button:hover { background: #fff; box-shadow: 0 0 25px #00e1ff; }

        #errorMsg { color: #ff4444; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="login-container">
        <h1 class="brand-title">FULL MARK</h1>
        <div class="glass-box">
            <input type="text" id="studentCode" placeholder="أدخل الكود الخاص بك" autocomplete="off">
            <button onclick="login()">دخول</button>
            <div id="errorMsg"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", { "particles": { "number": { "value": 50 }, "color": { "value": "#00e1ff" }, "shape": { "type": "circle" }, "opacity": { "value": 0.5, "random": true }, "size": { "value": 2, "random": true }, "line_linked": { "enable": true, "distance": 150, "color": "#00e1ff", "opacity": 0.1, "width": 1 }, "move": { "enable": true, "speed": 1 } } });
        
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        async function login() {
            const code = document.getElementById('studentCode').value.trim();
            const err = document.getElementById('errorMsg');
            if (!code) return;
            document.querySelector('button').innerText = '...';
            try {
                const snap = await db.collection('codes').where('code', '==', code).get();
                if (snap.empty) throw new Error("الكود خطأ");
                const d = snap.docs[0].data();
                if (d.status === 'banned') throw new Error("محظور");
                if (d.status === 'expired' || new Date() > d.expiresAt.toDate()) {
                    if(d.status!=='expired') db.collection('codes').doc(snap.docs[0].id).update({status:'expired'});
                    throw new Error("منتهي الصلاحية");
                }
                localStorage.setItem('fullmark_user', code); window.location.href = "index.html"; 
            } catch (e) {
                err.innerText = e.message; err.style.display = 'block'; document.querySelector('button').innerText = "دخول";
            }
        }
    </script>
</body>
</html>
