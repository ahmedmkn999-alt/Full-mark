<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدعم الفني | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: #fff; font-family: 'Cairo'; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #111; border-left: 1px solid #333; overflow-y: auto; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #000; }
        
        .user-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .user-item:hover, .user-item.active { background: #222; }
        .u-name { font-weight: bold; color: #00e1ff; }
        .u-last { font-size: 0.8rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 70%; }
        .msg.student { align-self: flex-start; background: #222; border: 1px solid #444; }
        .msg.support { align-self: flex-end; background: #00e1ff; color: #000; }

        .input-area { padding: 20px; background: #111; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #00e1ff; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar" id="usersList">
        <div style="padding:20px; text-align:center;">جاري التحميل...</div>
    </div>

    <div class="chat-area">
        <div id="chatHeader" style="padding:15px; background:#151515; border-bottom:1px solid #333; font-weight:bold;">اختر طالباً للبدء</div>
        <div class="msgs" id="msgsBox"></div>
        <div class="input-area">
            <input type="text" id="admInput" placeholder="الرد...">
            <button onclick="sendReply()">إرسال</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        let currentStudentCode = null;

        // تحميل قائمة الطلاب اللي بعتوا رسايل
        db.collection('support').orderBy('lastUpdate', 'desc').onSnapshot(snap => {
            const list = document.getElementById('usersList');
            list.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `
                <div class="user-item" onclick="openChat('${doc.id}', '${d.studentName}')">
                    <div class="u-name">${d.studentName || 'طالب'} (${d.studentCode})</div>
                    <div class="u-last">${d.lastMessage}</div>
                </div>`;
            });
        });

        let chatListener = null;
        function openChat(code, name) {
            currentStudentCode = code;
            document.getElementById('chatHeader').innerText = `محادثة مع: ${name}`;
            const box = document.getElementById('msgsBox');
            
            if(chatListener) chatListener(); // إيقاف الاستماع القديم

            chatListener = db.collection('support').doc(code).collection('messages')
                .orderBy('createdAt', 'asc')
                .onSnapshot(snap => {
                    box.innerHTML = '';
                    snap.forEach(doc => {
                        const m = doc.data();
                        const type = m.sender === 'student' ? 'student' : 'support';
                        box.innerHTML += `<div class="msg ${type}">${m.text}</div>`;
                    });
                    box.scrollTop = box.scrollHeight;
                });
        }

        function sendReply() {
            const txt = document.getElementById('admInput').value;
            if(!txt || !currentStudentCode) return;

            db.collection('support').doc(currentStudentCode).collection('messages').add({
                text: txt, sender: 'support', createdAt: new Date()
            });
            document.getElementById('admInput').value = '';
        }
    </script>
</body>
  </html>
