<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #000; --card: #111; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle, #001a1f 0%, #000 90%); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(20,20,20,0.95); border-bottom: 2px solid var(--main);
            padding: 15px 20px; border-radius: 20px; margin-bottom: 30px; 
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 20px rgba(0, 225, 255, 0.6); }
        
        .header-icons { display: flex; gap: 12px; }
        .icon-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid #444; 
            background: #000; color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .icon-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); transform: scale(1.1); }
        .icon-btn.logout { color: #ff4444; border-color: #ff4444; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; } }

        .card { 
            background: #0a0a0a; border: 1px solid #222; border-radius: 25px; overflow: hidden; 
            position: relative; transition: 0.4s; cursor: pointer;
        }
        .card:active { transform: scale(0.95); }
        .card:hover { transform: translateY(-5px); border-color: var(--main); box-shadow: 0 0 20px rgba(0, 225, 255, 0.2); }
        
        .card-img { width: 100%; height: 200px; object-fit: cover; }
        .card-title { 
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; 
            background: rgba(0,0,0,0.8); text-align: center; font-weight: 800; font-size: 1.1rem;
        }

        /* المودال */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #111; border: 1px solid var(--main); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; text-align: center; box-shadow: 0 0 50px rgba(0,225,255,0.2); }
        .close-btn { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; cursor: pointer; z-index: 10; }

        /* تفاصيل البروفايل */
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--main); margin-bottom: 15px; padding: 5px; }
        .user-code-badge { background: #222; color: var(--main); padding: 5px 15px; border-radius: 50px; font-family: monospace; font-size: 1.2rem; display: inline-block; margin-bottom: 15px; border: 1px solid #333; }
        
        /* الشات */
        .chat-container { height: 400px; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; background: #000; border: 1px solid #333; border-radius: 10px; margin-bottom: 10px; }
        .msg { padding: 8px 12px; margin-bottom: 5px; border-radius: 8px; display: inline-block; max-width: 85%; }
        .msg.me { background: var(--main); color: #000; float: right; clear: both; }
        .msg.support { background: #333; color: #fff; float: left; clear: both; }
        .chat-input { width: 80%; padding: 10px; border-radius: 50px; border: none; outline: none; background: #222; color: #fff; }
        .chat-send { width: 18%; padding: 10px; border-radius: 50px; border: none; background: var(--main); cursor: pointer; font-weight: bold; }

        /* الفيديو */
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .video-header { padding: 15px; background: #111; border-bottom: 1px solid #222; color: var(--main); font-weight: bold; display: flex; align-items: center; justify-content: space-between; }
        
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        h2 { border-right: 5px solid var(--main); padding-right: 15px; font-size: 1.8rem; margin: 0; }
        #backBtn { display: none; background: #222; color: var(--main); border: 1px solid var(--main); padding: 8px 25px; border-radius: 50px; cursor: pointer; }
    </style>
</head>
