<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Mark | المنصة</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #02050a; --card-bg: #0a0f18; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(10, 15, 24, 0.95); border-bottom: 2px solid var(--main);
            padding: 15px 20px; border-radius: 20px; margin-bottom: 30px; 
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.15); backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.7); }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0, 225, 255, 0.3);
            background: rgba(0,0,0,0.5); color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-left: 8px;
        }
        .icon-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); }
        
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { font-size: 1.5rem; color: var(--main); border-right: 4px solid var(--main); padding-right: 15px; margin: 0; }
        #backBtn { display: none; background: transparent; color: var(--main); border: 2px solid var(--main); padding: 8px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding-bottom: 50px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }

        .card { 
            background: var(--card-bg); border: 1px solid rgba(0, 225, 255, 0.1); border-radius: 20px; 
            overflow: hidden; cursor: pointer; transition: 0.4s; position: relative;
        }
        .card:hover { transform: translateY(-7px); border-color: var(--main); box-shadow: 0 0 25px rgba(0, 225, 255, 0.2); }
        
        .card-img-container { width: 100%; height: 180px; position: relative; background: #000; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .img-fallback { 
            position: absolute; top:0; left:0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            background: #111; color: var(--main); font-size: 1.2rem; font-weight: bold; text-align: center; padding: 10px;
            flex-direction: column;
        }
        .card-title { padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; color: #fff; background: #0a0a0a; border-top: 1px solid #222; }

        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .video-header { padding: 15px; background: #111; color: var(--main); font-weight: bold; }

        /* --- تصميم المودال الجديد --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { 
            background: #0f121a; border: 1px solid var(--main); padding: 0; border-radius: 20px; 
            width: 90%; max-width: 400px; position: relative; box-shadow: 0 0 50px rgba(0, 225, 255, 0.2); 
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header { padding: 15px; background: rgba(0, 225, 255, 0.1); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; color: #fff; }
        .close { color: #fff; font-size: 25px; cursor: pointer; }

        /* --- تصميم البروفايل الاحترافي --- */
        .profile-card { text-align: center; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--main); padding: 3px; margin-bottom: 15px; box-shadow: 0 0 20px rgba(0, 225, 255, 0.3); }
        .profile-name { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .profile-code { font-family: monospace; background: #222; color: var(--main); padding: 5px 15px; border-radius: 50px; font-size: 1.1rem; display: inline-block; margin-bottom: 20px; }
        
        .timer-box { 
            background: linear-gradient(45deg, #111, #1a1a1a); border: 1px solid #333; border-radius: 15px; padding: 15px; margin-top: 15px; 
        }
        .timer-title { font-size: 0.9rem; color: #888; margin-bottom: 10px; }
        .timer-val { font-size: 1.4rem; font-weight: bold; color: var(--main); }

        /* --- تصميم الشات --- */
        .chat-box { height: 400px; display: flex; flex-direction: column; background: #000; }
        .chat-msgs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; position: relative; }
        .msg.student { align-self: flex-end; background: var(--main); color: #000; border-bottom-left-radius: 2px; }
        .msg.support { align-self: flex-start; background: #222; color: #fff; border: 1px solid #333; border-bottom-right-radius: 2px; }
        .chat-input-area { padding: 15px; background: #111; border-top: 1px solid #333; display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; border-radius: 50px; border: 1px solid #333; background: #000; color: #fff; outline: none; }
        .send-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--main); border: none; cursor: pointer; color: #000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="container">
        <header>
            <div class="logo">FULL MARK</div>
            <div style="display:flex;">
                <div class="icon-btn" onclick="openSupport()"><i class="fas fa-headset"></i></div>
                <div class="icon-btn" onclick="openProfile()"><i class="fas fa-user"></i></div>
                <div class="icon-btn" style="border-color:red; color:red;" onclick="logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </header>

        <div class="nav-bar">
            <h2 id="pageTitle">المواد الدراسية</h2>
            <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
        </div>
        
        <div id="gridArea" class="grid"></div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>الملف الشخصي</h3>
                <span class="close" onclick="closeModal('profileModal')">&times;</span>
            </div>
            <div class="modal-body profile-card">
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="profile-img">
                <div id="pName" class="profile-name">جاري التحميل...</div>
                <div id="pCode" class="profile-code">...</div>
                
                <div class="timer-box">
                    <div class="timer-title">الاشتراك ينتهي خلال</div>
                    <div id="pTimer" class="timer-val">...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="supportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>الدعم الفني</h3>
                <span class="close" onclick="closeModal('supportModal')">&times;</span>
            </div>
            <div class="chat-box">
                <div class="chat-msgs" id="chatBody">
                    </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك...">
                    <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script src="arabic.js"></script>
    <script src="math.js"></script>
    <script src="geo.js"></script>
    <script src="langs.js"></script>

    <script>
        // تشغيل الخلفية
        particlesJS("particles-js", { "particles": { "number": { "value": 60 }, "color": { "value": "#00e1ff" }, "shape": { "type": "circle" }, "opacity": { "value": 0.5 }, "size": { "value": 3 }, "line_linked": { "enable": true, "distance": 150, "color": "#00e1ff", "opacity": 0.2, "width": 1 }, "move": { "enable": true, "speed": 1 } } });

        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // تجميع الداتا (زي ما اتفقنا)
        const ALL_DATA = [
            { name: "اللغة العربية", img: "https://i.postimg.cc/L6xvnk5X/mn-awl-mn-tklm-allght-alʿrbyt.jpg", teachers: (typeof ARABIC_DATA !== 'undefined' ? ARABIC_DATA : []) },
            { name: "الرياضيات", img: "https://i.postimg.cc/yN0LYkGR/m-dah-alryadyat-alzamyt-fy-brytanya-ll-khd-balaqtsad-qdma.jpg", teachers: (typeof MATH_DATA !== 'undefined' ? MATH_DATA : []) },
            { name: "الجغرافيا", img: "https://files.coursatk.online/images/subjects/geography.png", teachers: (typeof GEO_DATA !== 'undefined' ? GEO_DATA : []) },
            { name: "اللغة الإنجليزية", img: "https://i.postimg.cc/TwvBCjry/characteristics-of-a-prestigious-language-school-1-1020x642-1.jpg", teachers: (typeof ENGLISH_DATA !== 'undefined' ? ENGLISH_DATA : []) },
            { name: "الفيزياء", img: "https://i.postimg.cc/Z5RBj2mp/904.jpg", teachers: (typeof PHYSICS_DATA !== 'undefined' ? PHYSICS_DATA : []) },
            { name: "الكيمياء", img: "https://i.postimg.cc/Njz4xR3j/4a228f61e5d6843a9ddd56e6cc39ef6d.jpg", teachers: (typeof CHEMISTRY_DATA !== 'undefined' ? CHEMISTRY_DATA : []) },
            { name: "الأحياء", img: "https://i.postimg.cc/cJjdZkVx/FB_IMG_1770384472698.jpg", teachers: (typeof BIOLOGY_DATA !== 'undefined' ? BIOLOGY_DATA : []) },
            { name: "اللغات الثانية", img: "https://cdn-icons-png.flaticon.com/512/3898/3898082.png", teachers: (typeof LANG2_DATA !== 'undefined' ? LANG2_DATA : []) }
        ];

        // منطق العرض
        const grid = document.getElementById('gridArea');
        const title = document.getElementById('pageTitle');
        const back = document.getElementById('backBtn');
        let viewStack = [];

        function createCard(title, img, onclick, icon) {
            return `
            <div class="card" onclick="${onclick}">
                <div class="card-img-container">
                    <div class="img-fallback"><i class="fas ${icon}"></i><br>${title}</div>
                    <img src="${img}" class="card-img" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
                </div>
                <div class="card-title">${title}</div>
            </div>`;
        }

        // 1. عرض المواد
        function renderSubjects() {
            title.innerText = "المواد الدراسية"; back.style.display = 'none'; grid.className = 'grid'; viewStack = [{type: 'subjects'}];
            grid.innerHTML = ALL_DATA.map((sub, i) => createCard(sub.name, sub.img, `renderTeachers(${i})`, 'fa-book')).join('');
        }

        // 2. عرض المدرسين
        window.renderTeachers = function(subIdx) {
            const sub = ALL_DATA[subIdx]; title.innerText = sub.name; back.style.display = 'block'; viewStack.push({type: 'teachers', subIdx});
            if(!sub.teachers || sub.teachers.length===0) { grid.innerHTML='<p style="text-align:center; color:#777; width:100%">قريباً</p>'; return; }
            grid.innerHTML = sub.teachers.map((t, i) => createCard(t.name, t.img || t.image || t.image_url, `renderFolders(${subIdx}, ${i})`, 'fa-chalkboard-teacher')).join('');
        }

        // 3. عرض الفصول
        window.renderFolders = function(subIdx, techIdx) {
            const teacher = ALL_DATA[subIdx].teachers[techIdx]; title.innerText = teacher.name; viewStack.push({type: 'folders', subIdx, techIdx});
            const folders = teacher.folders || teacher.chapters;
            if(!folders || folders.length===0) { grid.innerHTML='<p style="text-align:center; color:#777; width:100%">لا يوجد محتوى</p>'; return; }
            grid.innerHTML = folders.map((c, i) => createCard(c.name || c.chapter_name, 'https://cdn-icons-png.flaticon.com/512/3767/3767084.png', `renderContent(${subIdx}, ${techIdx}, ${i})`, 'fa-folder')).join('');
        }

        // 4. عرض المحتوى
        window.renderContent = function(subIdx, techIdx, folIdx) {
            const teacher = ALL_DATA[subIdx].teachers[techIdx];
            const folders = teacher.folders || teacher.chapters;
            const folder = folders[folIdx];
            if(folder.lectures) {
                title.innerText = folder.chapter_name; viewStack.push({type: 'lectures', subIdx, techIdx, folIdx});
                grid.innerHTML = folder.lectures.map((l, i) => createCard(l.lecture_name, 'https://cdn-icons-png.flaticon.com/512/2997/2997380.png', `renderVideos(${subIdx}, ${techIdx}, ${folIdx}, ${i})`, 'fa-video')).join('');
            } else if(folder.videos) {
                renderVideos(subIdx, techIdx, folIdx, null);
            }
        }

        // 5. عرض الفيديوهات
        window.renderVideos = function(subIdx, techIdx, folIdx, lecIdx) {
            const teacher = ALL_DATA[subIdx].teachers[techIdx];
            const folders = teacher.folders || teacher.chapters;
            let videos = [];
            let pageTitleText = "";

            if(lecIdx !== null) {
                const lecture = folders[folIdx].lectures[lecIdx];
                videos = lecture.videos;
                pageTitleText = lecture.lecture_name;
                viewStack.push({type: 'videos'});
            } else {
                videos = folders[folIdx].videos;
                pageTitleText = folders[folIdx].name;
                viewStack.push({type: 'videos_direct'});
            }

            title.innerText = pageTitleText; grid.className = ''; 
            if(!videos || videos.length === 0) { grid.innerHTML='<p style="text-align:center; color:#777;">لا يوجد فيديوهات</p>'; return; }

            grid.innerHTML = videos.map((v, i) => {
                const vTitle = v.title || v.video_name;
                return `<div class="video-wrapper"><div class="video-header">${vTitle}</div><div class="plyr__video-embed" id="player-wrap-${i}"><video id="vid-${i}" controls crossorigin playsinline style="width:100%"></video></div></div>`;
            }).join('');

            setTimeout(() => {
                videos.forEach((v, i) => {
                    const videoEl = document.getElementById(`vid-${i}`);
                    let link = v.link;
                    if(!link && v.links && v.links.length > 0) link = v.links[0].url;

                    if (link.includes('youtube')) {
                        document.getElementById(`player-wrap-${i}`).innerHTML = `<iframe src="https://www.youtube.com/embed/${link.split('v=')[1]}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>`;
                    } else if (Hls.isSupported()) {
                        const hls = new Hls(); hls.loadSource(link); hls.attachMedia(videoEl); new Plyr(videoEl);
                    } else {
                        videoEl.src = link; new Plyr(videoEl);
                    }
                });
            }, 100);
        }

        window.goBack = function() {
            viewStack.pop(); const prev = viewStack[viewStack.length-1];
            if(!prev) return;
            if(prev.type === 'subjects') renderSubjects();
            else if(prev.type === 'teachers') renderTeachers(prev.subIdx);
            else if(prev.type === 'folders') renderFolders(prev.subIdx, prev.techIdx);
            else if(prev.type === 'lectures') renderContent(prev.subIdx, prev.techIdx, prev.folIdx);
        }

        // ====== الوظائف الجديدة: البروفايل والشات ======

        function openModal(id){ document.getElementById(id).style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }

        // 1. بروفايل محترم
        function openProfile(){ 
            openModal('profileModal'); 
            const u = localStorage.getItem('fullmark_user');
            if(u) db.collection('codes').where('code','==',u).get().then(s=>{
                if(!s.empty) { 
                    const d=s.docs[0].data(); 
                    document.getElementById('pName').innerText = d.studentName; 
                    document.getElementById('pCode').innerText = d.code;
                    
                    // حساب الوقت المتبقي
                    const exp = d.expiresAt.toDate();
                    const now = new Date();
                    const diffTime = Math.abs(exp - now);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    
                    if (exp < now) {
                        document.getElementById('pTimer').innerText = "منتهي";
                        document.getElementById('pTimer').style.color = "red";
                    } else {
                        document.getElementById('pTimer').innerText = diffDays + " يوم";
                    }
                }
            });
        }

        // 2. شات الدعم (إرسال واستقبال)
        let chatUnsubscribe = null;
        function openSupport() { 
            openModal('supportModal'); 
            const u = localStorage.getItem('fullmark_user');
            if(!u) return;

            // لو كنا فاتحين الشات قبل كده، نقفل الاستماع القديم
            if(chatUnsubscribe) chatUnsubscribe();

            const box = document.getElementById('chatBody');
            // استماع للرسائل في الوقت الفعلي
            chatUnsubscribe = db.collection('support').doc(u).collection('messages')
                .orderBy('createdAt', 'asc')
                .onSnapshot(snap => {
                    box.innerHTML = '';
                    if(snap.empty) {
                        box.innerHTML = '<div style="text-align:center; color:#777; margin-top:50px;">ا
