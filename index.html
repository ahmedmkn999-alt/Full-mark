<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Mark | المنصة</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #000; --card: #111; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle, #001a1f 0%, #000 90%); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(20,20,20,0.95); border-bottom: 2px solid var(--main);
            padding: 15px 20px; border-radius: 20px; margin-bottom: 30px; 
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 20px rgba(0, 225, 255, 0.6); }
        
        .header-icons { display: flex; gap: 12px; }
        .icon-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid #444; 
            background: #000; color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .icon-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); transform: scale(1.1); }
        .icon-btn.logout { color: #ff4444; border-color: #ff4444; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; } }

        .card { 
            background: #0a0a0a; border: 1px solid #222; border-radius: 25px; overflow: hidden; 
            position: relative; transition: 0.4s; cursor: pointer;
        }
        .card:active { transform: scale(0.95); }
        .card:hover { transform: translateY(-5px); border-color: var(--main); box-shadow: 0 0 20px rgba(0, 225, 255, 0.2); }
        
        .card-img { width: 100%; height: 200px; object-fit: cover; }
        .card-title { 
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px; 
            background: rgba(0,0,0,0.8); text-align: center; font-weight: 800; font-size: 1.1rem;
        }

        /* المودال */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #111; border: 1px solid var(--main); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; text-align: center; box-shadow: 0 0 50px rgba(0,225,255,0.2); }
        .close-btn { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; cursor: pointer; z-index: 10; }

        /* تفاصيل البروفايل */
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--main); margin-bottom: 15px; padding: 5px; }
        .user-code-badge { background: #222; color: var(--main); padding: 5px 15px; border-radius: 50px; font-family: monospace; font-size: 1.2rem; display: inline-block; margin-bottom: 15px; border: 1px solid #333; }
        
        /* الشات */
        .chat-container { height: 400px; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 10px; background: #000; border: 1px solid #333; border-radius: 10px; margin-bottom: 10px; }
        .msg { padding: 8px 12px; margin-bottom: 5px; border-radius: 8px; display: inline-block; max-width: 85%; }
        .msg.me { background: var(--main); color: #000; float: right; clear: both; }
        .msg.support { background: #333; color: #fff; float: left; clear: both; }
        .chat-input { width: 80%; padding: 10px; border-radius: 50px; border: none; outline: none; background: #222; color: #fff; }
        .chat-send { width: 18%; padding: 10px; border-radius: 50px; border: none; background: var(--main); cursor: pointer; font-weight: bold; }

        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        h2 { border-right: 5px solid var(--main); padding-right: 15px; font-size: 1.8rem; margin: 0; }
        #backBtn { display: none; background: #222; color: var(--main); border: 1px solid var(--main); padding: 8px 25px; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="container">
        <header>
            <div class="logo">FULL MARK</div>
            <div class="header-icons">
                <div class="icon-btn" onclick="openSupport()"><i class="fas fa-headset"></i></div>
                <div class="icon-btn" onclick="openProfile()"><i class="fas fa-user"></i></div>
                <div class="icon-btn logout" onclick="logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </header>

        <div id="profileModal" class="modal-overlay">
            <div class="modal-box">
                <i class="fas fa-times close-btn" onclick="closeModal('profileModal')"></i>
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="profile-pic">
                <h3 id="pName" style="color:#fff; margin-bottom:5px;">جاري التحميل...</h3>
                <div id="pCode" class="user-code-badge">...</div>
                <p id="pExp" style="color:#888;">...</p>
            </div>
        </div>

        <div id="supportModal" class="modal-overlay">
            <div class="modal-box chat-container">
                <i class="fas fa-times close-btn" onclick="closeModal('supportModal')"></i>
                <h3 style="color:var(--main); margin-bottom:10px;">الدعم الفني</h3>
                <div class="messages" id="chatMsgs"></div>
                <div style="display:flex; justify-content:space-between;">
                    <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="chat-send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div class="nav-bar">
            <h2 id="pageTitle">المواد الدراسية</h2>
            <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
        </div>
        
        <div id="gridArea" class="grid"></div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // 1. البيانات (صور مضمونة)
        const DATA = [
            {
                name: "اللغة العربية",
                img: "https://placehold.co/600x400/000/00e1ff?text=اللغة+العربية&font=roboto",
                teachers: [
                    { name: "أ. محمد صلاح", img: "https://placehold.co/400x400/111/fff?text=محمد+صلاح", folders: [{name:"شرح المنهج", videos:[{title:"محاضرة 1", link:"dQw4w9WgXcQ"}]}] },
                    { name: "أ. رضا الفاروق", img: "https://placehold.co/400x400/111/fff?text=رضا+الفاروق", folders: [] }
                ]
            },
            {
                name: "اللغة الإنجليزية",
                img: "https://placehold.co/600x400/000/00e1ff?text=English",
                teachers: [
                    { name: "عبقري لغة", img: "https://placehold.co/400x400/111/fff?text=عبقري+لغة", folders: [] },
                    { name: "م. شريف المصري", img: "https://placehold.co/400x400/111/fff?text=شريف+المصري", folders: [] }
                ]
            },
            {
                name: "الفيزياء",
                img: "https://placehold.co/600x400/000/00e1ff?text=الفيزياء",
                teachers: [
                    { name: "أ. محمد عبد المعبود", img: "https://placehold.co/400x400/111/fff?text=عبد+المعبود", folders: [] },
                    { name: "دكتور كيرلس", img: "https://placehold.co/400x400/111/fff?text=د+كيرلس", folders: [] }
                ]
            },
            {
                name: "الكيمياء",
                img: "https://placehold.co/600x400/000/00e1ff?text=الكيمياء",
                teachers: [
                    { name: "أ. خالد صقر", img: "https://placehold.co/400x400/111/fff?text=خالد+صقر", folders: [] },
                    { name: "أ. محمد عبدالجواد", img: "https://placehold.co/400x400/111/fff?text=عبدالجواد", folders: [] }
                ]
            },
            {
                name: "الفرنساوي",
                img: "https://placehold.co/600x400/000/00e1ff?text=French",
                teachers: [
                    { name: "مسيو انس السعيد", img: "https://placehold.co/400x400/111/fff?text=أنس+السعيد", folders: [
                        {name: "شرح المنهج", videos: [
                            {title: "جزء 1 تالتة ثانوي", link: "3PC1fxpp-Xk"},
                            {title: "جزء 2 تالتة ثانوي", link: "fVJTHj5YW7Y"},
                            {title: "جزء 3 تالتة ثانوي", link: "Afx9AHypc7M"},
                            {title: "الجزء الاخير", link: "6s_TWiP1KgQ"}
                        ]}
                    ]}
                ]
            },
            {
                name: "الألماني",
                img: "https://placehold.co/600x400/000/00e1ff?text=German",
                teachers: [
                    { name: "هير ياسين", img: "https://placehold.co/400x400/111/fff?text=هير+ياسين", folders: [
                        {name: "كورس التأسيس", videos: [{title: "المحاضرة الأولى", link: "JOLc4Jc9yFU"}]}
                    ]}
                ]
            },
            {
                name: "الإيطالي",
                img: "https://placehold.co/600x400/000/00e1ff?text=Italian",
                teachers: [
                    { name: "سنيور مدحت", img: "https://placehold.co/400x400/111/fff?text=مدحت", folders: [
                        {name: "المراجعة النهائية", videos: [{title: "المنهج كاملاً", link: "T6hpZH5AMnk"}]}
                    ]}
                ]
            },
            {
                name: "الإسباني",
                img: "https://placehold.co/600x400/000/00e1ff?text=Spanish",
                teachers: [
                    { name: "سنيور ماجد فارس", img: "https://placehold.co/400x400/111/fff?text=ماجد+فارس", folders: [
                        {name: "مراجعات", videos: [{title: "شرح كامل للمنهج", link: "K9ZOydc1cqs"}]}
                    ]}
                ]
            }
        ];

        // 2. إعدادات Firebase
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); 
        const db = firebase.firestore();

        // 3. التطبيق
        const userCode = localStorage.getItem('fullmark_user');
        if(!userCode) window.location.href = "login.html";

        let currentView = 'subjects';
        let subIndex = 0;
        let techIndex = 0;
        
        const grid = document.getElementById('gridArea');
        const title = document.getElementById('pageTitle');
        const back = document.getElementById('backBtn');

        function showSubjects() {
            currentView = 'subjects';
            title.innerText = "المواد الدراسية";
            back.style.display = 'none';
            grid.className = "grid";
            grid.innerHTML = DATA.map((sub, i) => `
                <div class="card" onclick="showTeachers(${i})">
                    <img src="${sub.img}" class="card-img">
                    <div class="card-title">${sub.name}</div>
                </div>
            `).join('');
        }

        function showTeachers(idx) {
            currentView = 'teachers';
            subIndex = idx;
            const sub = DATA[idx];
            title.innerText = "مدرسين " + sub.name;
            back.style.display = 'block';
            if(sub.teachers.length === 0) { grid.innerHTML = '<p style="color:#777; width:100%; text-align:center;">قريباً...</p>'; return; }
            grid.innerHTML = sub.teachers.map((t, i) => `
                <div class="card" onclick="showFolders(${i})">
                    <img src="${t.img}" class="card-img">
                    <div class="card-title">${t.name}</div>
                </div>
            `).join('');
        }

        function showFolders(idx) {
            currentView = 'folders';
            techIndex = idx;
            const tech = DATA[subIndex].teachers[idx];
            title.innerText = "كورسات " + tech.name;
            if(!tech.folders || tech.folders.length === 0) { grid.innerHTML = '<p style="color:#777; width:100%; text-align:center;">لا يوجد كورسات</p>'; return; }
            grid.innerHTML = tech.folders.map((f, i) => `
                <div class="card" onclick="showVideos(${i})">
                    <img src="https://placehold.co/400x300/111/fff?text=Course" class="card-img" style="object-fit:contain; padding:20px;">
                    <div class="card-title">${f.name}</div>
                </div>
            `).join('');
        }

        function showVideos(idx) {
            currentView = 'videos';
            const folder = DATA[subIndex].teachers[techIndex].folders[idx];
            title.innerText = folder.name;
            grid.className = "";
            grid.innerHTML = folder.videos.map(v => `
                <div class="video-wrapper">
                    <div class="plyr__video-embed"><iframe src="https://www.youtube.com/embed/${v.link}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&rel=0" allowfullscreen allow="autoplay"></iframe></div>
                    <div class="video-title">${v.title}</div>
                </div>
            `).join('');
            Plyr.setup('.plyr__video-embed');
        }

        function goBack() {
            if (currentView === 'videos') showFolders(techIndex);
            else if (currentView === 'folders') showTeachers(subIndex);
            else showSubjects();
        }

        // --- المودال ---
        function openModal(id) { 
            document.getElementById(id).style.display = 'flex'; 
        }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
        }

        // --- البروفايل ---
        function openProfile() {
            openModal('profileModal');
            db.collection('codes').where('code', '==', userCode).get().then(snap => {
                if(!snap.empty) {
                    const d = snap.docs[0].data();
                    document.getElementById('pName').innerText = d.studentName;
                    document.getElementById('pCode').innerText = d.code;
                    document.getElementById('pExp').innerText = "ينتهي: " + d.expiresAt.toDate().toLocaleDateString('ar-EG');
                }
            }).catch(e => {
                document.getElementById('pName').innerText = "خطأ في الاتصال";
            });
        }

        // --- الدعم الفني ---
        function openSupport() {
            openModal('supportModal');
            loadChat();
        }
        function sendMsg() {
            const txt = document.getElementById('chatInput').value;
            if(!txt) return;
            db.collection('support').doc(userCode).collection('messages').add({
                text: txt, sender: 'me', createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('chatInput').value = '';
        }
        function loadChat() {
            const box = document.getElementById('chatMsgs');
            db.collection('support').doc(userCode).collection('messages').orderBy('createdAt').onSnapshot(snap => {
                box.innerHTML = '';
                if(snap.empty) box.innerHTML = '<div style="text-align:center; color:#555; margin-top:50px;">تواصل معنا</div>';
                snap.forEach(doc => {
                    const m = doc.data();
                    box.innerHTML += `<div style="overflow:hidden; width:100%;"><div class="msg ${m.sender}">${m.text}</div></div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function logout() { localStorage.removeItem('fullmark_user'); window.location.href="login.html"; }

        // تشغيل
        showSubjects();
    </script>
</body>
                    </html>
