<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Mark | المنصة</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* التصميم الأزرق النيون */
        :root { --main: #00e1ff; --bg: #02050a; --card-bg: #0a0f18; --text: #fff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; }
        
        /* الخلفية المتحركة (مهم جداً z-index -1) */
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        .app-container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(10, 15, 24, 0.95); border-bottom: 2px solid var(--main);
            padding: 15px 20px; border-radius: 20px; margin-bottom: 30px; 
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.15); backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.7); }
        
        .nav-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(0, 225, 255, 0.3);
            background: rgba(0,0,0,0.5); color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-left: 8px;
        }
        .nav-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); }
        
        /* العناوين */
        .section-title { font-size: 1.5rem; margin-bottom: 20px; border-right: 4px solid var(--main); padding-right: 15px; color: var(--main); }

        /* الشبكة */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-bottom: 40px; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }

        /* الكارت */
        .card { 
            background: var(--card-bg); border: 1px solid rgba(0, 225, 255, 0.1); border-radius: 20px; 
            overflow: hidden; cursor: pointer; transition: 0.4s; position: relative;
        }
        .card:hover { transform: translateY(-7px); border-color: var(--main); box-shadow: 0 0 25px rgba(0, 225, 255, 0.2); }
        
        .card-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid var(--main); }
        
        /* بديل الصورة */
        .img-fallback { 
            width: 100%; height: 180px; display: flex; align-items: center; justify-content: center;
            background: #111; color: var(--main); font-size: 3rem; border-bottom: 2px solid var(--main);
        }

        .card-body { padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }

        /* الفيديو */
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .video-header { padding: 15px; background: #111; color: var(--main); font-weight: bold; }

        /* زرار الرجوع */
        #backBtn { 
            display: none; background: transparent; color: var(--main); border: 2px solid var(--main); 
            padding: 8px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 20px; 
        }
        #backBtn:hover { background: var(--main); color: #000; }

        /* المودال */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { background: var(--card-bg); border: 2px solid var(--main); padding: 30px; border-radius: 25px; width: 90%; max-width: 400px; text-align: center; position: relative; box-shadow: 0 0 50px rgba(0, 225, 255, 0.2); }
        .close { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 25px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="app-container">
        <header>
            <div class="logo">FULL MARK</div>
            <div style="display:flex;">
                <button class="nav-btn" onclick="alert('خدمة الدعم قريباً')"><i class="fas fa-headset"></i></button>
                <button class="nav-btn" onclick="openProfile()"><i class="fas fa-user"></i></button>
                <button class="nav-btn" style="color:#ff4444; border-color:#ff4444;" onclick="logout()"><i class="fas fa-power-off"></i></button>
            </div>
        </header>

        <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
        <h2 id="pageTitle" class="section-title">المواد الدراسية</h2>
        
        <div id="contentGrid" class="grid-container"></div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('profileModal')">&times;</span>
            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" style="width:100px; border-radius:50%; border:3px solid var(--main); margin-bottom:15px;">
            <h3 id="pName" style="color:white; margin-bottom:10px;">تحميل...</h3>
            <div id="pCode" style="color:var(--main); font-family:monospace; background:#000; padding:5px 15px; border-radius:10px; display:inline-block;">...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // 1. تشغيل الخلفية
        particlesJS("particles-js", { "particles": { "number": { "value": 60 }, "color": { "value": "#00e1ff" }, "shape": { "type": "circle" }, "opacity": { "value": 0.5 }, "size": { "value": 3 }, "line_linked": { "enable": true, "distance": 150, "color": "#00e1ff", "opacity": 0.2, "width": 1 }, "move": { "enable": true, "speed": 1 } } });

        // 2. الفايربيز
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // 3. البيانات (الصور والأسماء اللي بعتها بالظبط)
        const DATA = [
            // العربي
            {
                name: "اللغة العربية",
                img: "https://i.postimg.cc/L6xvnk5X/mn-awl-mn-tklm-allght-alʿrbyt.jpg",
                teachers: [
                    { 
                        name: "أ. محمد صلاح", 
                        img: "https://i.postimg.cc/ZRJy8gDR/FB-IMG-1770382315133.jpg",
                        // دمجنا هنا فيديوهات محمد صلاح من الملف الكبير
                        folders: [
                            { name: "معسكر 4-1", videos: [{title: "شرح النحو - المهمة الأولى", link: "https://river-4-429.rtbcdn.ru/hls-vod/pY6nkzrcG4lHcv1P_FKB1w/1770639813/3322/0x5000c500e9ebd5af/7ed17944068f431bbc6a44ed612999bd.mp4.m3u8"}] },
                            { name: "الشهر الأول", videos: [{title: "المحاضرة الأولى", link: "https://river-5-545.rtbcdn.ru/hls-vod/lMLIGlXXPat9W2owCUKuWw/1770646511/3320/0x5000c500e9daa4c6/c24ad275e16e460e8f576a81bf0d7ba5.mp4.m3u8"}] }
                        ]
                    },
                    { name: "أ. رضا الفاروق", img: "https://i.postimg.cc/c4Pg965p/1723904748-y-CL9UA.png", folders: [] }
                ]
            },
            // الإنجليزي
            {
                name: "اللغة الإنجليزية",
                img: "https://i.postimg.cc/TwvBCjry/characteristics-of-a-prestigious-language-school-1-1020x642-1.jpg",
                teachers: [
                    { name: "عبقري لغة", img: "https://i.postimg.cc/85CzPV0d/mr-tarek-hero-section-f2bf4f0e2cf0c8b0d728.png", folders: [] },
                    { name: "م. شريف المصري", img: "https://i.postimg.cc/4nRGtCBW/loginbg.png", folders: [] },
                    { name: "مي مجدي", img: "https://i.postimg.cc/DzS7tcJs/FB-IMG-1770382635144.jpg", folders: [] },
                    { name: "انجلشاوي", img: "https://i.postimg.cc/X7q1K1Td/splashs1.png", folders: [] }
                ]
            },
            // الفيزياء
            {
                name: "الفيزياء",
                img: "https://i.postimg.cc/Z5RBj2mp/904.jpg",
                teachers: [
                    { name: "محمد عبد المعبود", img: "https://i.postimg.cc/fRTXpkcm/FB_IMG_1770383335913.jpg", folders: [] },
                    { name: "مستر كيرلس", img: "https://i.postimg.cc/qR0pD6nd/FB-IMG-1770383231786.jpg", folders: [] },
                    { name: "محمود مجدي", img: "https://i.postimg.cc/wjGVkDCy/Magdy_Image_ab6042b951be2cb6297e.png", folders: [] },
                    { name: "حسام خليل", img: "https://i.postimg.cc/pL6ZBKwm/c3_21a0b369.png", folders: [] }
                ]
            },
            // الكيمياء
            {
                name: "الكيمياء",
                img: "https://i.postimg.cc/Njz4xR3j/4a228f61e5d6843a9ddd56e6cc39ef6d.jpg",
                teachers: [
                    { name: "خالد صقر", img: "https://i.postimg.cc/hGQ0Zfn9/teacher_Bflsmq_Qf.webp", folders: [] },
                    { name: "محمد عبدالجواد", img: "https://i.postimg.cc/rpR9ZKTR/c78ffbf64a791da67752132a9aaf7c8f127fc4f4.jpg", folders: [] },
                    { name: "عبدالله حبشي", img: "https://i.postimg.cc/MGfY3vwV/hero_light.webp", folders: [] },
                    { name: "عمرو الصيفي", img: "https://i.postimg.cc/5tQmK6Jm/FB_IMG_1770384007129.jpg", folders: [] },
                    { name: "جون جهبذ", img: "https://i.postimg.cc/3w0Zfdh9/gahbaz_hero_section_main_character_308fc2da8ff8bae443d4.webp", folders: [] }
                ]
            },
            // الأحياء
            {
                name: "الأحياء",
                img: "https://i.postimg.cc/cJjdZkVx/FB_IMG_1770384472698.jpg",
                teachers: [
                    { name: "أحمد الجوهري", img: "https://i.postimg.cc/XJC4vcbq/89549ee43b7a31c4f350f0d32a116fbd02313c37.png", folders: [] },
                    { name: "محمد أيمن", img: "https://i.postimg.cc/856NCBS7/profile_433b1d2b5e7bfd30bed5.png", folders: [] },
                    { name: "أحمد رضوان", img: "https://i.postimg.cc/fbFMZq6L/FB_IMG_1770384659581.jpg", folders: [] },
                    { name: "جيو ماجد", img: "https://i.postimg.cc/pd7PxcgR/FB_IMG_1770384621215.jpg", folders: [] },
                    { name: "سامح أحمد", img: "https://i.postimg.cc/g05Gdtf2/FB-IMG-1770384584699.jpg", folders: [] }
                ]
            },
            // الرياضيات
            {
                name: "الرياضيات",
                img: "https://i.postimg.cc/yN0LYkGR/مادة_الرياضيات_إلزامية_في_بريطانيا_للأخذ_بالاقتصاد_قدما.jpg",
                teachers: [
                    { 
                        name: "أحمد عصام", 
                        img: "https://i.postimg.cc/fyRCK5RJ/essam_dark.png",
                        folders: [ { name: "الديناميكا", videos: [{title:"الحصة الأولى", link:"https://river-3-379.rtbcdn.ru/hls-vod/06STGPfnWguOTNuFlMZgMQ/1770751943/2618/0x5000039ce868e9d9/22b8200bea934ba5a9dd9774119704a2.mp4.m3u8"}] } ]
                    },
                    { 
                        name: "لطفي زهران", 
                        img: "https://i.postimg.cc/sXywB3Fh/Lotfy_a940b4e08c6abf7a6821.png",
                        folders: [ { name: "معسكر الفراغية", videos: [{title:"شرح الفراغية", link:"https://river-3-343.rtbcdn.ru/hls-vod/q2gpG37FzyJ0GlwCyYCAxg/1770654567/3290/0x5000c500fa6e36fa/b184d50653474fb4b3c5e2dd9e391798.mp4.m3u8"}] } ]
                    }
                ]
            },
            // اللغات التانية
            {
                name: "اللغات الثانية",
                img: "https://cdn-icons-png.flaticon.com/512/3898/3898082.png",
                teachers: [
                    { name: "فرنساوي (مسيو انس)", img: "https://i.postimg.cc/sDdy3JyV/lhctmi-Qt-ANEg0PDcec-CE1QTCqr-Kza-Eq-GZ6s-Zt-MJ4.jpg", folders: [{name:"المنهج", videos:[{title:"جزء 1", link:"https://www.youtube.com/watch?v=3PC1fxpp-Xk"}]}] },
                    { name: "ألماني (هير ياسين)", img: "https://i.postimg.cc/MHkkKzCd/hqdefault-(1).jpg", folders: [{name:"تأسيس", videos:[{title:"المحاضرة 1", link:"https://www.youtube.com/watch?v=JOLc4Jc9yFU"}]}] },
                    { name: "إيطالي (سنيور مدحت)", img: "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg", folders: [{name:"مراجعة", videos:[{title:"شامل", link:"https://www.youtube.com/watch?v=T6hpZH5AMnk"}]}] },
                    { name: "إسباني (سنيور ماجد)", img: "https://i.postimg.cc/jdbVpdQ5/FB-IMG-1770239115997.jpg", folders: [{name:"مراجعة", videos:[{title:"شامل", link:"https://www.youtube.com/watch?v=K9ZOydc1cqs"}]}] }
                ]
            }
        ];

        // 4. منطق التطبيق (محمي من الأخطاء)
        const grid = document.getElementById('contentGrid');
        const title = document.getElementById('pageTitle');
        const back = document.getElementById('backBtn');
        let state = { view: 'subjects', subIdx: 0, techIdx: 0 };

        // دالة إنشاء كارت
        function makeCard(title, img, onclick) {
            return `
            <div class="card" onclick="${onclick}">
                <img src="${img}" class="card-img" onerror="this.parentElement.innerHTML='<div class=\'img-fallback\'><i class=\'fas fa-image\'></i></div>'">
                <div class="card-body">${title}</div>
            </div>`;
        }

        // عرض المواد
        function renderSubjects() {
            state.view = 'subjects';
            title.innerText = 'المواد الدراسية';
            back.style.display = 'none';
            grid.className = 'grid-container';
            grid.innerHTML = DATA.map((sub, i) => makeCard(sub.name, sub.img, `renderTeachers(${i})`)).join('');
        }

        // عرض المدرسين
        function renderTeachers(idx) {
            state.view = 'teachers'; state.subIdx = idx;
            const sub = DATA[idx];
            title.innerText = sub.name;
            back.style.display = 'inline-block';
            
            if(!sub.teachers || sub.teachers.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#aaa;">قريباً</p>';
                return;
            }
            grid.innerHTML = sub.teachers.map((t, i) => makeCard(t.name, t.img, `renderFolders(${i})`)).join('');
        }

        // عرض الكورسات (الفولدرات)
        function renderFolders(idx) {
            state.view = 'folders'; state.techIdx = idx;
            const teacher = DATA[state.subIdx].teachers[idx];
            title.innerText = teacher.name;
            
            if(!teacher.folders || teacher.folders.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#aaa;">لا يوجد كورسات حالياً</p>';
                return;
            }
            grid.innerHTML = teacher.folders.map((f, i) => makeCard(f.name, 'https://cdn-icons-png.flaticon.com/512/3767/3767084.png', `renderVideos(${i})`)).join('');
        }

        // عرض الفيديو
        function renderVideos(idx) {
            state.view = 'videos';
            const folder = DATA[state.subIdx].teachers[state.techIdx].folders[idx];
            title.innerText = folder.name;
            grid.className = ''; // إلغاء الشبكة عشان الفيديوهات تحت بعض
            
            grid.innerHTML = folder.videos.map((v, i) => `
                <div class="video-wrapper">
                    <div class="video-header">${v.title}</div>
                    <div class="plyr__video-embed" id="player-container-${i}">
                        <video id="player-${i}" controls crossorigin playsinline style="width:100%"></video>
                    </div>
                </div>
            `).join('');

            // تشغيل الفيديو (يوتيوب أو m3u8)
            setTimeout(() => {
                folder.videos.forEach((v, i) => {
                    const video = document.getElementById(`player-${i}`);
                    
                    if (v.link.includes('youtube')) {
                        const vidId = v.link.split('v=')[1];
                        document.getElementById(`player-container-${i}`).innerHTML = 
                            `<iframe src="https://www.youtube.com/embed/${vidId}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>`;
                    } else if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(v.link);
                        hls.attachMedia(video);
                        new Plyr(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = v.link;
                        new Plyr(video);
                    }
                });
            }, 100);
        }

        function goBack() {
            if(state.view === 'videos') renderFolders(state.techIdx);
            else if(state.view === 'folders') renderTeachers(state.subIdx);
            else if(state.view === 'teachers') renderSubjects();
        }

        // --- المودال ---
        function openModal(id){ document.getElementById(id).style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }
        function openProfile(){ 
            openModal('profileModal'); 
            const u = localStorage.getItem('fullmark_user');
            if(u) db.collection('codes').where('code','==',u).get().then(s=>{
                if(!s.empty) { 
                    const d=s.docs[0].data(); 
                    document.getElementById('pName').innerText=d.studentName; 
                    document.getElementById('pCode').innerText=d.code; 
                }
            });
        }
        function logout(){ localStorage.removeItem('fullmark_user'); window.location.href="login.html"; }

        // Start
        if(!localStorage.getItem('fullmark_user')) window.location.href="login.html";
        renderSubjects();

    </script>
</body>
</html>
