    <title>Full Mark | المنصة</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* الألوان: أسود ملكي وأزرق نيون */
        :root { --main: #00e1ff; --bg: #020617; --card-bg: #0a0f18; --text: #fff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative; /* مهم عشان الطبقات */
        }
        
        /* 🔥 إصلاح الخلفية: لازم تكون Fixed و Z-Index بالسالب 🔥 */
        #particles-js { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; /* خلفية ورا كل حاجة */
            background-image: radial-gradient(circle at center, #0a1525 0%, #000000 100%); /* لون احتياطي */
        }
        
        /* 🔥 إصلاح المحتوى: لازم يكون Relative و Z-Index بالموجب 🔥 */
        .container { 
            position: relative; 
            z-index: 10; /* محتوى قدام الخلفية */
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(15, 23, 42, 0.95); border-bottom: 2px solid var(--main);
            padding: 15px 20px; border-radius: 20px; margin-bottom: 30px; 
            backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0, 225, 255, 0.1);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.6); }
        
        .header-icons { display: flex; gap: 10px; }
        .icon-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid #333; 
            background: #000; color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .icon-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); transform: scale(1.1); }
        .icon-btn.logout { border-color: #ef4444; color: #ef4444; }
        .icon-btn.logout:hover { background: #ef4444; color: #fff; box-shadow: 0 0 20px #ef4444; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; } }

        .card { 
            background: var(--card-bg); border: 1px solid #1e293b; border-radius: 20px; overflow: hidden; 
            position: relative; transition: 0.4s; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card:hover { transform: translateY(-7px); border-color: var(--main); box-shadow: 0 0 25px rgba(0, 225, 255, 0.2); }
        
        .card-img-container { width: 100%; height: 180px; position: relative; background: #000; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; opacity: 0; } 
        .card-img.loaded { opacity: 1; }
        
        .img-fallback {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(45deg, #0f172a, #1e293b);
            color: var(--main); font-size: 1.5rem; font-weight: bold;
            text-align: center; padding: 10px;
        }

        .card-title { 
            padding: 15px; text-align: center; font-weight: 800; font-size: 1.1rem; 
            background: #0f172a; border-top: 1px solid #1e293b; color: #fff;
        }

        /* الفيديو */
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .video-header { padding: 15px; background: #1e293b; color: var(--main); font-weight: bold; text-align: center; }

        /* التنقل */
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { border-right: 5px solid var(--main); padding-right: 15px; font-size: 1.6rem; margin: 0; color: #fff; }
        #backBtn { display: none; background: #1e293b; color: var(--main); border: 1px solid var(--main); padding: 8px 25px; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        #backBtn:hover { background: var(--main); color: #000; }
        
        /* المودال */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: #0f172a; border: 1px solid var(--main); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; text-align: center; box-shadow: 0 0 50px rgba(0,225,255,0.2); }
        .close-btn { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; cursor: pointer; z-index: 10; }
        
        /* الشات */
        .chat-msgs { flex: 1; overflow-y: auto; padding: 10px; background: #020617; border: 1px solid #1e293b; border-radius: 10px; margin-bottom: 10px; min-height: 200px; }
        .msg { padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; display: inline-block; max-width: 85%; font-size: 0.9rem; }
        .msg.me { background: var(--main); color: #000; float: left; clear: both; font-weight: bold; }
        .msg.support { background: #333; color: #fff; float: right; clear: both; }
        .chat-input { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #333; color: #fff; border-radius: 50px; outline: none; }
    </style>
</head>
