<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ذاكرلي | منصة الطالب</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* الثيم الأزرق النيون */
        :root { --main: #00e1ff; --bg: #02050a; --card-bg: #0a0f18; --text: #fff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: linear-gradient(135deg, #02050a 0%, #050a14 100%); color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; }

        .container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(10, 15, 24, 0.95); border-bottom: 2px solid var(--main);
            padding: 10px 20px; border-radius: 20px; margin-bottom: 25px; 
            box-shadow: 0 0 30px rgba(0, 225, 255, 0.15); backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.7); }
        
        .header-icons { display: flex; gap: 10px; align-items: center; }
        
        .header-profile-img {
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--main);
            object-fit: cover; cursor: pointer; transition: 0.3s;
        }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0, 225, 255, 0.3);
            background: rgba(0,0,0,0.5); color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .logout-btn { color: #ff4444; border-color: #ff4444; }

        /* التنقل */
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { font-size: 1.4rem; color: var(--main); border-right: 4px solid var(--main); padding-right: 12px; margin: 0; }
        
        /* زر الرجوع (تم إصلاحه) */
        #backBtn { 
            display: none; /* مخفي افتراضياً */
            background: transparent; color: var(--main); border: 2px solid var(--main); 
            padding: 6px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
            transition: 0.3s;
        }
        #backBtn:active { background: var(--main); color: #000; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; } }

        .card { background: var(--card-bg); border: 1px solid rgba(0, 225, 255, 0.15); border-radius: 15px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .card:active { transform: scale(0.97); border-color: var(--main); }
        
        .card-img-container { width: 100%; height: 170px; background: #000; display: flex; align-items: center; justify-content: center; }
        .card-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-title { padding: 12px; text-align: center; font-weight: bold; font-size: 1rem; color: #fff; background: #0f121a; border-top: 1px solid rgba(255,255,255,0.1); }

        /* الفيديو */
        .video-list { display: flex; flex-direction: column; gap: 20px; }
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; position: relative; }
        .video-header { padding: 15px; background: #111; color: var(--main); font-weight: bold; font-size: 1rem; border-bottom: 1px solid #333; }
        .empty-msg { text-align: center; color: #777; margin-top: 50px; font-size: 1.2rem; grid-column: 1/-1; border: 1px dashed #333; padding: 20px; border-radius: 10px; }

        /* المودال */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal-content { background: #0f121a; border: 1px solid var(--main); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; box-shadow: 0 0 40px rgba(0, 225, 255, 0.2); }
        .close { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 22px; cursor: pointer; z-index: 10; }
        
        .profile-img-container { position: relative; display: inline-block; margin-bottom: 15px; cursor: pointer; }
        .modal-profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--main); padding: 3px; object-fit: cover; }
        .edit-icon { position: absolute; bottom: 0; right: 0; background: var(--main); color: #000; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; border: 2px solid #000; }
        .timer-digits { font-family: monospace; font-size: 1.5rem; font-weight: bold; color: #fff; letter-spacing: 2px; margin-top: 10px; }

        /* الشات */
        .chat-box { height: 400px; display: flex; flex-direction: column; }
        .chat-msgs { flex: 1; overflow-y: auto; padding: 15px; background: #050505; border: 1px solid #333; border-radius: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; }
        .msg.me { background: var(--main); color: #000; align-self: flex-end; border-bottom-left-radius: 2px; }
        .msg.support { background: #222; color: #fff; align-self: flex-start; border: 1px solid #333; border-bottom-right-radius: 2px; }
        .chat-input-area { display: flex; gap: 10px; align-items: center; background: #111; padding: 10px; border-radius: 50px; border: 1px solid #333; }
        .chat-input { flex: 1; border: none; background: transparent; color: #fff; outline: none; padding: 5px; font-size: 1rem; }
        .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--main); border: none; cursor: pointer; color: #000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">ذاكرلي</div>
            <div class="header-icons">
                <div class="icon-btn" onclick="openSupport()"><i class="fas fa-headset"></i></div>
                <img id="headerProfilePic" src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="header-profile-img" onclick="openProfile()">
                <div class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </header>

        <div id="mainView">
            <div class="nav-bar">
                <h2 id="pageTitle">المواد الدراسية</h2>
                <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
            </div>
            
            <div id="gridArea" class="grid"></div>
        </div>
        
        <div style="height: 50px;"></div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('profileModal')">&times;</span>
            <div class="profile-img-container" onclick="document.getElementById('uploadProfile').click()">
                <img id="modalProfilePic" src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" class="modal-profile-img">
                <div class="edit-icon"><i class="fas fa-camera"></i></div>
            </div>
            <input type="file" id="uploadProfile" style="display: none;" accept="image/*" onchange="changeProfilePic(this)">
            <div style="margin-bottom: 5px;"><span id="pName" style="color:#fff; font-weight:bold; font-size: 1.3rem;">...</span></div>
            <div style="margin-bottom: 20px;"><span id="pCode" style="color:#888; font-family:monospace; background:#111; padding:3px 10px; border-radius:5px;">...</span></div>
            <div style="border-top: 1px solid #333; padding-top: 15px;">
                <div style="font-size: 0.9rem; color: #ccc;">المتبقي من الاشتراك</div>
                <div id="countdown" class="timer-digits">00:00:00:00</div>
            </div>
        </div>
    </div>

    <div id="supportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('supportModal')">&times;</span>
            <h3 style="color:var(--main); margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">الدعم الفني</h3>
            <div class="chat-box">
                <div class="chat-msgs" id="chatBody">
                    <div style="text-align:center; color:#555; margin-top:50px;">كيف يمكننا مساعدتك؟</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك..." onkeypress="if(event.keyCode==13) sendMsg()">
                    <button class="send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // البيانات الكاملة
        const ALL_DATA = [
            {
                name: "اللغة العربية", img: "https://i.postimg.cc/L6xvnk5X/mn-awl-mn-tklm-allght-alʿrbyt.jpg",
                teachers: [{ name: "أ. محمد صلاح", img: "https://i.postimg.cc/ZRJy8gDR/FB-IMG-1770382315133.jpg", videos: [] }, { name: "أ. رضا الفاروق", img: "https://i.postimg.cc/c4Pg965p/1723904748-y-CL9UA.png", videos: [] }]
            },
            {
                name: "اللغة الإنجليزية", img: "https://i.postimg.cc/TwvBCjry/characteristics-of-a-prestigious-language-school-1-1020x642-1.jpg",
                teachers: [{ name: "عبقري لغة", img: "https://i.postimg.cc/85CzPV0d/mr-tarek-hero-section-f2bf4f0e2cf0c8b0d728.png", videos: [] }, { name: "شريف المصري", img: "https://i.postimg.cc/4nRGtCBW/loginbg.png", videos: [] }]
            },
            {
                name: "الفيزياء", img: "https://i.postimg.cc/Z5RBj2mp/904.jpg",
                teachers: [{ name: "محمد عبد المعبود", img: "https://i.postimg.cc/fRTXpkcm/FB_IMG_1770383335913.jpg", videos: [] }, { name: "مستر كيرلس", img: "https://i.postimg.cc/qR0pD6nd/FB-IMG-1770383231786.jpg", videos: [] }]
            },
            {
                name: "الكيمياء", img: "https://i.postimg.cc/Njz4xR3j/4a228f61e5d6843a9ddd56e6cc39ef6d.jpg",
                teachers: [{ name: "خالد صقر", img: "https://i.postimg.cc/hGQ0Zfn9/teacher_Bflsmq_Qf.webp", videos: [] }, { name: "أ. محمد عبدالجواد", img: "https://i.postimg.cc/rpR9ZKTR/c78ffbf64a791da67752132a9aaf7c8f127fc4f4.jpg", videos: [] }]
            },
            {
                name: "الأحياء", img: "https://i.postimg.cc/cJjdZkVx/FB_IMG_1770384472698.jpg",
                teachers: [{ name: "د.أحمد الجوهري", img: "https://i.postimg.cc/XJC4vcbq/89549ee43b7a31c4f350f0d32a116fbd02313c37.png", videos: [] }, { name: "محمد أيمن", img: "https://i.postimg.cc/856NCBS7/profile_433b1d2b5e7bfd30bed5.png", videos: [] }]
            },
            {
                name: "الرياضيات", img: "https://i.postimg.cc/yN0LYkGR/m-dah-alryadyat-alzamyt-fy-brytanya-ll-khd-balaqtsad-qdma.jpg",
                teachers: [{ name: "م.احمد عصام", img: "https://i.postimg.cc/fyRCK5RJ/essam_dark.png", videos: [] }, { name: "م. لطفي زهران", img: "https://i.postimg.cc/sXywB3Fh/Lotfy_a940b4e08c6abf7a6821.png", videos: [] }]
            },
            {
                name: "الجغرافيا", img: "https://files.coursatk.online/images/subjects/geography.png",
                teachers: [{ name: "جمعة السيد", img: "https://files.coursatk.online/images/content/2b233a89685a724df18a65c7b2ba6a3263f2932b3e8a.jpg", videos: [] }, { name: "أحمد زهران", img: "https://files.coursatk.online/images/questions/5eab71b642c6672b9182be0d1dd887beb3c8d2b98cf2.jpg", videos: [] }]
            },
            {
                name: "اللغات الثانية", img: "https://cdn-icons-png.flaticon.com/512/3898/3898082.png",
                teachers: [
                    { name: "فرنساوي (مسيو انس)", img: "https://i.postimg.cc/NjRcy2s0/a75e136b-7909-485f-95e8-862fddd2c0bc.png", videos: [{title:"الجزء 1", link:"3PC1fxpp-Xk"}] },
                    { name: "ألماني (هير ياسين)", img: "https://i.postimg.cc/bw1hGSyS/52023310-702.jpg", videos: [{title:"التأسيس", link:"JOLc4Jc9yFU"}] },
                    { name: "إيطالي (سنيور مدحت)", img: "https://i.postimg.cc/0NQ1VWGy/hqdefault.jpg", videos: [{title:"المنهج كامل", link:"T6hpZH5AMnk"}] },
                    { name: "إسباني (سنيور ماجد)", img: "https://i.postimg.cc/L8jpqg95/250px-Flag-of-Spain-svg.png", videos: [{title:"شرح كامل", link:"K9ZOydc1cqs"}] }
                ]
            }
        ];

        // منطق التطبيق
        const grid = document.getElementById('gridArea');
        const title = document.getElementById('pageTitle');
        const back = document.getElementById('backBtn');
        let viewStack = [];

        function createCard(title, img, onclick) {
            return `
            <div class="card" onclick="${onclick}">
                <div class="card-img-container">
                    <img src="${img}" class="card-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1160/1160358.png'">
                </div>
                <div class="card-title">${title}</div>
            </div>`;
        }

        // عرض المواد
        function renderSubjects() {
            title.innerText = "المواد الدراسية";
            back.style.display = 'none'; // إخفاء زر الرجوع في الرئيسية
            grid.className = 'grid';
            viewStack = [{type: 'subjects'}];
            grid.innerHTML = ALL_DATA.map((sub, i) => createCard(sub.name, sub.img, `renderTeachers(${i})`)).join('');
        }

        // عرض المدرسين
        window.renderTeachers = function(subIdx) {
            const sub = ALL_DATA[subIdx];
            title.innerText = sub.name;
            back.style.display = 'inline-block'; // إظهار زر الرجوع
            viewStack.push({type: 'teachers', subIdx});
            
            if(!sub.teachers || sub.teachers.length === 0) {
                grid.innerHTML = '<div class="empty-msg">قريباً</div>';
                return;
            }
            grid.innerHTML = sub.teachers.map((t, i) => createCard(t.name, t.img, `renderVideos(${subIdx}, ${i})`)).join('');
        }

        // عرض الفيديوهات
        window.renderVideos = function(subIdx, teacherIdx) {
            const teacher = ALL_DATA[subIdx].teachers[teacherIdx];
            title.innerText = teacher.name;
            back.style.display = 'inline-block'; // تأكيد إظهار زر الرجوع
            viewStack.push({type: 'videos'});
            grid.className = 'video-list';

            if(!teacher.videos || teacher.videos.length === 0) {
                grid.innerHTML = '<div class="empty-msg">قريباً..</div>';
                return;
            }

            grid.innerHTML = teacher.videos.map((v, i) => `
                <div class="video-wrapper">
                    <div class="video-header">${v.title}</div>
                    <div class="plyr__video-embed">
                        <iframe src="https://www.youtube.com/embed/${v.link}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe>
                    </div>
                </div>`).join('');
            
            setTimeout(() => { Array.from(document.querySelectorAll('.plyr__video-embed')).map(p => new Plyr(p)); }, 500);
        }

        // إصلاح زر الرجوع
        window.goBack = function() {
            if (viewStack.length > 1) {
                viewStack.pop(); // احذف الصفحة الحالية
                const prev = viewStack[viewStack.length - 1]; // هات الصفحة اللي قبلها

                if (prev.type === 'subjects') {
                    renderSubjects();
                } else if (prev.type === 'teachers') {
                    renderTeachers(prev.subIdx);
                }
            }
        }

        // --- المودال والبروفايل ---
        function openModal(id){ document.getElementById(id).style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }
        
        const savedAvatar = localStorage.getItem('user_avatar');
        if(savedAvatar) {
            document.getElementById('headerProfilePic').src = savedAvatar;
            document.getElementById('modalProfilePic').src = savedAvatar;
        }
        function changeProfilePic(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newSrc = e.target.result;
                    document.getElementById('headerProfilePic').src = newSrc;
                    document.getElementById('modalProfilePic').src = newSrc;
                    localStorage.setItem('user_avatar', newSrc);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openProfile(){ 
            openModal('profileModal'); 
            const u = localStorage.getItem('fullmark_user');
            if(u) db.collection('codes').where('code','==',u).get().then(s=>{
                if(!s.empty) { 
                    const d=s.docs[0].data(); 
                    document.getElementById('pName').innerText=d.studentName; 
                    document.getElementById('pCode').innerText=d.code; 
                    const exp = d.expiresAt.toDate();
                    setInterval(() => {
                        const now = new Date().getTime();
                        const dist = exp - now;
                        if (dist < 0) { document.getElementById("countdown").innerText = "منتهي"; }
                        else {
                            const d = Math.floor(dist / (1000 * 60 * 60 * 24));
                            const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
                            document.getElementById("countdown").innerText = `${d} يوم : ${h} ساعة : ${m} دقيقة`;
                        }
                    }, 1000);
                }
            });
        }

        // --- الشات ---
        const userCode = localStorage.getItem('fullmark_user');
        function openSupport() { openModal('supportModal'); loadChat(); }
        function sendMsg() {
            const txt = document.
