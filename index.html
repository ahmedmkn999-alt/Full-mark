    <style>
        :root { --main: #00e1ff; --bg: #000000; --card: #111; --text: #fff; --msg-user: #00e1ff; --msg-admin: #222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        /* خلفية */
        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle, rgba(0,225,255,0.05) 0%, rgba(0,0,0,1) 90%); }
        .app-container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* الهيدر */
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,20,0.95); border-bottom: 1px solid #00e1ff; padding: 15px 20px; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 0 20px rgba(0, 225, 255, 0.2); backdrop-filter: blur(10px); }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.6); }
        
        /* أزرار الهيدر */
        .nav-btn { background: transparent; color: var(--main); border: 2px solid var(--main); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 1.2rem; position: relative; margin-left: 10px;}
        .nav-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 25px var(--main); transform: scale(1.1); }

        /* الكروت */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }
        
        .card { background: var(--card); border: 1px solid #333; border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.4s; position: relative; }
        .card:hover { transform: translateY(-7px); border-color: var(--main); box-shadow: 0 0 25px rgba(0, 225, 255, 0.3); }
        .card-img { width: 100%; height: 180px; object-fit: cover; transition: 0.4s; }
        .card:hover .card-img { transform: scale(1.05); }
        .card-body { padding: 15px; text-align: center; font-weight: 800; font-size: 1.1rem; background: linear-gradient(0deg, #000 0%, transparent 100%); position: absolute; bottom: 0; width: 100%; text-shadow: 0 2px 5px #000; }

        /* مودال الشات والبروفايل */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        
        /* كارت الشات */
        .chat-card { background: #0a0a0a; border: 1px solid var(--main); width: 95%; max-width: 450px; height: 80vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0, 225, 255, 0.2); }
        .chat-header { padding: 15px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: var(--main); }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-footer { padding: 15px; background: #111; border-top: 1px solid #333; display: flex; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; }
        .msg.user { align-self: flex-start; background: var(--msg-user); color: #000; font-weight: bold; }
        .msg.admin { align-self: flex-end; background: #222; color: #fff; border: 1px solid #444; }
        .chat-input { flex: 1; background: #222; border: 1px solid #444; padding: 10px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--main); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        /* كارت البروفايل */
        .profile-card { background: #050505; border: 2px solid var(--main); padding: 30px; border-radius: 25px; text-align: center; width: 90%; max-width: 350px; position: relative; box-shadow: 0 0 60px rgba(0, 225, 255, 0.2); }
        .close-modal { cursor: pointer; color: #fff; font-size: 25px; transition: 0.3s; }
        .close-modal:hover { color: var(--main); transform: rotate(90deg); }
        
        .timer-box { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .time-unit { background: #111; border: 1px solid var(--main); padding: 10px; border-radius: 10px; min-width: 60px; }
        .time-val { font-size: 1.4rem; font-weight: 900; color: var(--main); display: block; }
        .time-label { font-size: 0.7rem; color: #fff; }

        /* الفيديو */
        .video-wrapper { max-width: 900px; margin: 0 auto; background: #111; border: 1px solid var(--main); border-radius: 16px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 0 30px rgba(0,225,255,0.1); }
        .video-info { padding: 20px; border-top: 1px solid #222; }

        #backBtn { display: none; background: transparent; color: var(--main); border: 1px solid var(--main); padding: 8px 30px; border-radius: 50px; cursor: pointer; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; }
        #backBtn:hover { background: var(--main); color: #000; box-shadow: 0 0 15px var(--main); }
        
        h2 { border-right: 5px solid var(--main); padding-right: 15px; font-size: 1.8rem; margin-bottom: 30px; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>

        // --- نظام الدعم الفني ---
        function openSupport() {
            document.getElementById('supportModal').style.display = 'flex';
            loadMessages();
        }
        function closeSupport() { document.getElementById('supportModal').style.display = 'none'; }
        
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;
            
            db.collection('support').doc(userCode).collection('messages').add({
                text: text, sender: 'user', createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = '';
        }

        function loadMessages() {
            const chatBody = document.getElementById('chatBody');
            db.collection('support').doc(userCode).collection('messages')
            .orderBy('createdAt', 'asc')
            .onSnapshot(snapshot => {
                chatBody.innerHTML = '';
                if(snapshot.empty) chatBody.innerHTML = '<div style="text-align:center; color:#555; margin-top:50px;"><i class="fas fa-comments fa-3x"></i><br>ابدأ المحادثة مع الدعم</div>';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = `msg ${msg.sender}`;
                    div.innerText = msg.text;
                    chatBody.appendChild(div);
                });
                chatBody.scrollTop = chatBody.scrollHeight;
            });
        }

        // --- البروفايل والعداد ---

            document.getElementById('profileModal').style.display = 'flex';

                    const d = snap.docs[0].data();
                    document.getElementById('pName').innerText = d.studentName;
                    document.getElementById('pCode').innerText = d.code;

                }
            });
