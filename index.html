<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Mark | المنصة</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* الثيم الأزرق النيون */
        :root { --main: #00e1ff; --bg: #02050a; --card-bg: #0a0f18; --text: #fff; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: linear-gradient(135deg, #02050a 0%, #050a14 100%);
            color: var(--text); min-height: 100vh; overflow-x: hidden; position: relative; 
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(10, 15, 24, 0.95); border-bottom: 2px solid var(--main);
            padding: 10px 20px; border-radius: 20px; margin-bottom: 25px; 
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.15); backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.6rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.7); }
        
        .header-icons { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0, 225, 255, 0.3);
            background: rgba(0,0,0,0.5); color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .logout-btn { color: #ff4444; border-color: #ff4444; }

        /* التنقل */
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { font-size: 1.4rem; color: var(--main); border-right: 4px solid var(--main); padding-right: 12px; margin: 0; }
        #backBtn { display: none; background: transparent; color: var(--main); border: 2px solid var(--main); padding: 6px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; } }

        .card { 
            background: var(--card-bg); border: 1px solid rgba(0, 225, 255, 0.15); border-radius: 15px; 
            overflow: hidden; cursor: pointer; transition: 0.3s; position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .card:active { transform: scale(0.97); border-color: var(--main); }
        
        /* صورة المنصة الموحدة */
        .card-img-container { 
            width: 100%; height: 160px; 
            background: #000; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card-img { 
            max-width: 100%; max-height: 100%; 
            object-fit: contain; 
            filter: drop-shadow(0 0 5px rgba(0, 225, 255, 0.5));
        }
        .card-title { padding: 12px; text-align: center; font-weight: bold; font-size: 1rem; color: #fff; background: #0f121a; border-top: 1px solid rgba(255,255,255,0.1); }

        /* الفيديو */
        .video-list { display: flex; flex-direction: column; gap: 20px; }
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .video-header { padding: 15px; background: #111; color: var(--main); font-weight: bold; font-size: 1rem; border-bottom: 1px solid #333; }
        .empty-msg { text-align: center; color: #777; margin-top: 50px; padding: 20px; border: 1px dashed #333; border-radius: 10px; grid-column: 1/-1; }

        /* المودال */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #0f121a; border: 1px solid var(--main); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; }
        .close { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">FULL MARK</div>
            <div class="header-icons">
                <div class="icon-btn" onclick="openProfile()"><i class="fas fa-user"></i></div>
                <div class="icon-btn logout-btn" onclick="logout()"><i class="fas fa-power-off"></i></div>
            </div>
        </header>

        <div class="nav-bar">
            <h2 id="pageTitle">المواد الدراسية</h2>
            <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
        </div>
        
        <div id="gridArea" class="grid"></div>
        <div style="height: 50px;"></div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('profileModal')">&times;</span>
            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" style="width:80px; border-radius:50%; border:3px solid var(--main); margin-bottom:15px;">
            <div style="margin-bottom:10px;">الاسم: <span id="pName" style="color:#fff; font-weight:bold;">...</span></div>
            <div>الكود: <span id="pCode" style="color:var(--main); font-family:monospace;">...</span></div>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // صورة المنصة الموحدة (أيقونة Full Mark زرقاء)
        const MAIN_IMG = "https://cdn-icons-png.flaticon.com/512/2997/2997380.png"; 

        // دمج بيانات الملف + المواد الأساسية
        const ALL_DATA = [
            // --- بيانات من الملف (كيمياء، أحياء، إنجليزي، تاريخ) ---
            {
                name: "الكيمياء", img: MAIN_IMG,
                teachers: [
                    { name: "أ. محمد عبدالجواد", img: MAIN_IMG, chapters: [{chapter_name: "الأساسيات", lectures: [{lecture_name: "التأسيس", videos: [{video_name: "التوزيع الإلكترونى", link: "https://river-5-533.rtbcdn.ru/hls-vod/iSmUdDzLxKk8Ln_4GDlIpQ/1770394615/3402/0x5000c500fa6e9016/dda8cd611e33417f84af22dfc71c0a91.mp4.m3u8"}]}]}] },
                    { name: "خالد صقر", img: MAIN_IMG, chapters: [] }
                ]
            },
            {
                name: "الأحياء", img: MAIN_IMG,
                teachers: [
                    { name: "د.احمد الجوهري", img: MAIN_IMG, chapters: [{chapter_name: "المناعة", lectures: [{lecture_name: "المناعة في النبات", videos: [{video_name: "شرح المناعة", link: "https://river-5-558.rtbcdn.ru/hls-vod/bF_chMQsNTvg_V7-VbQCjg/1770501574/2646/0x5000039ce83a1935/810eac247fde4049b986dcc6a930358d.mp4.m3u8"}]}]}] },
                    { name: "محمد أيمن", img: MAIN_IMG, chapters: [] }
                ]
            },
            {
                name: "اللغة الإنجليزية", img: MAIN_IMG,
                teachers: [
                    { name: "عبقري لغة", img: MAIN_IMG, chapters: [{chapter_name: "Unit 7", lectures: [{lecture_name: "Unit 7", videos: [{video_name: "لعبة كلمات", link: "https://river-3-345.rtbcdn.ru/hls-vod/oYl6bYGCWxjkkzOTjczQeQ/1770554251/1879/0x5000c500e53a27da/9d1a971b866f4bd081ea784b13680871.mp4.m3u8"}]}]}] }
                ]
            },
            // --- مواد أساسية (بدون محتوى حالياً) ---
            { name: "اللغة العربية", img: MAIN_IMG, teachers: [{name: "أ. محمد صلاح", img: MAIN_IMG, chapters: []}] },
            { name: "الرياضيات", img: MAIN_IMG, teachers: [{name: "أ. أحمد عصام", img: MAIN_IMG, chapters: []}] },
            { name: "الفيزياء", img: MAIN_IMG, teachers: [{name: "أ. محمود مجدي", img: MAIN_IMG, chapters: []}] },
            // --- اللغات الثانية ---
            {
                name: "اللغات الثانية", img: MAIN_IMG,
                teachers: [
                    { name: "فرنساوي (مسيو انس)", img: MAIN_IMG, videos: [{title:"الجزء 1", link:"3PC1fxpp-Xk"}] },
                    { name: "ألماني (هير ياسين)", img: MAIN_IMG, videos: [{title:"التأسيس", link:"JOLc4Jc9yFU"}] },
                    { name: "إيطالي (سنيور مدحت)", img: MAIN_IMG, videos: [{title:"المنهج كامل", link:"T6hpZH5AMnk"}] },
                    { name: "إسباني (سنيور ماجد)", img: MAIN_IMG, videos: [{title:"شرح كامل", link:"K9ZOydc1cqs"}] }
                ]
            }
        ];

        // منطق التطبيق
        const grid = document.getElementById('gridArea');
        const title = document.getElementById('pageTitle');
        const back = document.getElementById('backBtn');
        let viewStack = [];

        function createCard(title, img, onclick) {
            return `
            <div class="card" onclick="${onclick}">
                <div class="card-img-container"><img src="${img}" class="card-img"></div>
                <div class="card-title">${title}</div>
            </div>`;
        }

        // عرض المواد
        function renderSubjects() {
            title.innerText = "المواد الدراسية"; back.style.display = 'none'; grid.className = 'grid'; viewStack = [{type: 'subjects'}];
            grid.innerHTML = ALL_DATA.map((sub, i) => createCard(sub.name, sub.img, `renderTeachers(${i})`)).join('');
        }

        // عرض المدرسين
        function renderTeachers(subIdx) {
            const sub = ALL_DATA[subIdx]; title.innerText = sub.name; back.style.display = 'inline-block'; viewStack.push({type: 'teachers', subIdx});
            if(!sub.teachers || sub.teachers.length===0) { grid.innerHTML='<div class="empty-msg">قريباً</div>'; return; }
            
            // لو المادة لغات ثانية (فيديوهات مباشرة)
            if(sub.name === "اللغات الثانية") {
                grid.innerHTML = sub.teachers.map((t, i) => createCard(t.name, t.img, `renderDirectVideos(${subIdx}, ${i})`)).join('');
            } else {
                grid.innerHTML = sub.teachers.map((t, i) => createCard(t.name, t.img, `renderChapters(${subIdx}, ${i})`)).join('');
            }
        }

        // عرض الفصول (للمواد الأساسية)
        function renderChapters(subIdx, techIdx) {
            const teacher = ALL_DATA[subIdx].teachers[techIdx]; title.innerText = teacher.name; viewStack.push({type: 'chapters', subIdx, techIdx});
            if(!teacher.chapters || teacher.chapters.length===0) { grid.innerHTML='<div class="empty-msg">لا يوجد محتوى حالياً</div>'; return; }
            grid.innerHTML = teacher.chapters.map((c, i) => createCard(c.chapter_name, MAIN_IMG, `renderLectures(${subIdx}, ${techIdx}, ${i})`)).join('');
        }

        // عرض المحاضرات
        function renderLectures(subIdx, techIdx, chapIdx) {
            const chapter = ALL_DATA[subIdx].teachers[techIdx].chapters[chapIdx]; title.innerText = chapter.chapter_name; viewStack.push({type: 'lectures', subIdx, techIdx, chapIdx});
            if(!chapter.lectures || chapter.lectures.length===0) { grid.innerHTML='<div class="empty-msg">فارغ</div>'; return; }
            grid.innerHTML = chapter.lectures.map((l, i) => createCard(l.lecture_name, MAIN_IMG, `renderVideos(${subIdx}, ${techIdx}, ${chapIdx}, ${i})`)).join('');
        }

        // عرض الفيديوهات (من الملف - m3u8)
        function renderVideos(subIdx, techIdx, chapIdx, lecIdx) {
            const lecture = ALL_DATA[subIdx].teachers[techIdx].chapters[chapIdx].lectures[lecIdx];
            title.innerText = lecture.lecture_name; grid.className = 'video-list'; viewStack.push({type: 'videos'});
            
            if(!lecture.videos || lecture.videos.length === 0) { grid.innerHTML='<div class="empty-msg">لا يوجد فيديوهات</div>'; return; }

            grid.innerHTML = lecture.videos.map((v, i) => `
                <div class="video-wrapper">
                    <div class="video-header">${v.video_name}</div>
                    <div class="plyr__video-embed"><video id="player-${i}" controls crossorigin playsinline style="width:100%"></video></div>
                </div>`).join('');

            // تشغيل HLS
            setTimeout(() => {
                lecture.videos.forEach((v, i) => {
                    const video = document.getElementById(`player-${i}`);
                    if(Hls.isSupported()) {
                        const hls = new Hls(); hls.loadSource(v.link); hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = v.link;
                    }
                    new Plyr(video);
                });
            }, 500);
        }

        // عرض فيديوهات اللغات الثانية (يوتيوب)
        function renderDirectVideos(subIdx, techIdx) {
            const teacher = ALL_DATA[subIdx].teachers[techIdx]; title.innerText = teacher.name; grid.className = 'video-list'; viewStack.push({type: 'videos'});
            
            grid.innerHTML = teacher.videos.map((v, i) => `
                <div class="video-wrapper">
                    <div class="video-header">${v.title}</div>
                    <div class="plyr__video-embed"><iframe src="https://www.youtube.com/embed/${v.link}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1" allowfullscreen allowtransparency allow="autoplay"></iframe></div>
                </div>`).join('');
            setTimeout(() => { Array.from(document.querySelectorAll('.plyr__video-embed')).map(p => new Plyr(p)); }, 500);
        }

        function goBack() {
            if(viewStack.length > 1) {
                viewStack.pop(); const prev = viewStack[viewStack.length-1];
                if(prev.type === 'subjects') renderSubjects();
                else if(prev.type === 'teachers') renderTeachers(prev.subIdx);
                else if(prev.type === 'chapters') renderChapters(prev.subIdx, prev.techIdx);
                else if(prev.type === 'lectures') renderLectures(prev.subIdx, prev.techIdx, prev.chapIdx);
            }
        }

        function openModal(id){ document.getElementById(id).style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }
        function openProfile(){ 
            openModal('profileModal'); 
            const u = localStorage.getItem('fullmark_user');
            if(u) db.collection('codes').where('code','==',u).get().then(s=>{
                if(!s.empty) { const d=s.docs[0].data(); document.getElementById('pName').innerText=d.studentName; document.getElementById('pCode').innerText=d.code; }
            });
        }
        function logout(){ localStorage.removeItem('fullmark_user'); window.location.href="login.html"; }

        if(!localStorage.getItem('fullmark_user')) window.location.href="login.html";
        renderSubjects();
    </script>
</body>
</html>
