<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المنصة | Full Mark</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #000000; --card: #111; --text: #fff; --msg-user: #00e1ff; --msg-admin: #222; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        /* خلفية */
        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; pointer-events: none; background: radial-gradient(circle, rgba(0,225,255,0.03) 0%, rgba(0,0,0,1) 90%); }
        .app-container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* الهيدر */
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(20,20,20,0.9); border-bottom: 1px solid #333; padding: 15px 20px; border-radius: 16px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 225, 255, 0.4); }
        
        /* أزرار الهيدر */
        .nav-btn { background: transparent; color: var(--main); border: 1px solid var(--main); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 1.2rem; position: relative; }
        .nav-btn:hover { background: var(--main); color: #000; box-shadow: 0 0 15px var(--main); }
        .badge-dot { position: absolute; top: 0; right: 0; width: 12px; height: 12px; background: red; border-radius: 50%; border: 2px solid #000; display: none; }

        /* الكروت */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }
        
        .card { background: var(--card); border: 1px solid #222; border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.4s; position: relative; }
        .card:hover { transform: translateY(-7px); border-color: var(--main); box-shadow: 0 10px 30px rgba(0, 225, 255, 0.15); }
        .card-img { width: 100%; height: 180px; object-fit: cover; transition: 0.4s; }
        .card:hover .card-img { transform: scale(1.05); }
        .card-body { padding: 15px; text-align: center; font-weight: 700; font-size: 1.1rem; background: linear-gradient(0deg, #111 0%, transparent 100%); position: absolute; bottom: 0; width: 100%; }

        /* مودال الشات والدعم */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .chat-card { background: #0a0a0a; border: 1px solid var(--main); width: 95%; max-width: 450px; height: 80vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 50px rgba(0, 225, 255, 0.1); }
        .chat-header { padding: 15px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: var(--main); }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-footer { padding: 15px; background: #111; border-top: 1px solid #333; display: flex; gap: 10px; }
        
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .msg.user { align-self: flex-start; background: var(--msg-user); color: #000; border-bottom-right-radius: 2px; }
        .msg.admin { align-self: flex-end; background: var(--msg-admin); color: #fff; border: 1px solid #333; border-bottom-left-radius: 2px; }
        
        .chat-input { flex: 1; background: #222; border: 1px solid #444; padding: 10px; border-radius: 25px; color: white; outline: none; }
        .send-btn { background: var(--main); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        /* مودال البروفايل */
        .profile-card { background: #111; border: 1px solid var(--main); padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 350px; position: relative; }
        .close-modal { cursor: pointer; color: #fff; font-size: 20px; }

        #backBtn { display: none; background: transparent; color: var(--main); border: 1px solid var(--main); padding: 8px 25px; border-radius: 50px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        h2 { border-right: 5px solid var(--main); padding-right: 15px; font-size: 1.5rem; margin-bottom: 25px; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="app-container">
        <header>
            <div class="logo">FULL MARK</div>
            <div style="display:flex; gap:10px;">
                <button class="nav-btn" onclick="openSupport()">
                    <i class="fas fa-headset"></i>
                    <div id="supportBadge" class="badge-dot"></div>
                </button>
                <button class="nav-btn" onclick="openProfile()"><i class="fas fa-user"></i></button>
                <button class="nav-btn" style="border-color:#ff4444; color:#ff4444;" onclick="logout()"><i class="fas fa-power-off"></i></button>
            </div>
        </header>

        <div id="supportModal" class="modal">
            <div class="chat-card">
                <div class="chat-header">
                    <span><i class="fas fa-headset"></i> الدعم الفني</span>
                    <i class="fas fa-times close-modal" onclick="closeSupport()"></i>
                </div>
                <div class="chat-body" id="chatBody">
                    <div style="text-align:center; color:#555; margin-top:50px;">
                        <i class="fas fa-comments fa-3x"></i><br>ابدأ المحادثة مع الدعم
                    </div>
                </div>
                <div class="chat-footer">
                    <input type="text" id="msgInput" class="chat-input" placeholder="اكتب شكوتك هنا...">
                    <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="profileModal" class="modal">
            <div class="profile-card">
                <i class="fas fa-times close-modal" style="position:absolute; left:20px; top:20px;" onclick="closeProfile()"></i>
                <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" style="width:100px; border-radius:50%; border:3px solid var(--main); margin-bottom:15px;">
                <h3 id="pName" style="color:#fff;">...</h3>
                <div id="pCode" style="font-family:monospace; color:var(--main); margin:10px 0;">...</div>
                <p id="pExp" style="color:#777; font-size:0.9rem;">...</p>
            </div>
        </div>

        <button id="backBtn" onclick="goBack()">🔙 رجوع</button>
        <h2 id="sectionTitle">المواد الدراسية</h2>
        <div id="contentArea" class="grid-container"></div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        particlesJS("particles-js", { "particles": { "number": { "value": 40 }, "color": { "value": "#00e1ff" }, "shape": { "type": "circle" }, "opacity": { "value": 0.3, "random": true }, "size": { "value": 2, "random": true }, "line_linked": { "enable": true, "distance": 150, "color": "#00e1ff", "opacity": 0.05, "width": 1 }, "move": { "enable": true, "speed": 0.8 } } });

        const firebaseConfig = { apiKey: "AIzaSyBKY38XHjmC-iGqGrQio_YZ_i1iaIaE2Ds", authDomain: "full-mark-8d434.firebaseapp.com", projectId: "full-mark-8d434", storageBucket: "full-mark-8d434.firebasestorage.app", messagingSenderId: "802579483999", appId: "1:802579483999:web:cf73136ffbd75d5e0ebaea" };
        firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

        // بيانات المنصة (مدمجة هنا عشان تشتغل علطول)
        const platformData = [
            { name: "اللغة العربية", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-0/s1600/arabic.jpg", teachers: [ { name: "أ. محمد صلاح", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-1/s1600/mohamed_salah.jpg", folders: [{title:"الكورسات", videos:[{title:"درس 1", vid:"dQw4w9WgXcQ"}]}] } ] },
            { name: "اللغة الإنجليزية", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-2/s1600/english.jpg", teachers: [ { name: "مستر شريف", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-3/s1600/sherif.jpg", folders: [] } ] },
            { name: "الفيزياء", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-4/s1600/physics.jpg", teachers: [ { name: "أ. عبد المعبود", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-5/s1600/abdelmaboud.jpg", folders: [] } ] },
            { name: "الكيمياء", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-6/s1600/chemistry.jpg", teachers: [] },
            { name: "الأحياء", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-7/s1600/biology.jpg", teachers: [] },
            { name: "الفرنساوي", image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg-gD5YqYqR-tXyW-uW-vZ-xZ-yZ-8/s1600/french.jpg", teachers: [] }
        ];
        // ملحوظة: أنا حطيت صور بديلة (Placeholders) مؤقتاً عشان لو الروابط القديمة بايظة الصور تظهر، تقدر تغير الروابط براحتك في الكود فوق.

        const userCode = localStorage.getItem('fullmark_user');
        if(!userCode) window.location.href = "login.html";

        let state = { level: 'subjects', subIdx: 0, techIdx: 0 };
        const content = document.getElementById('contentArea');

        // --- نظام الدعم الفني ---
        function openSupport() {
            document.getElementById('supportModal').style.display = 'flex';
            document.getElementById('supportBadge').style.display = 'none';
            loadMessages();
        }
        function closeSupport() { document.getElementById('supportModal').style.display = 'none'; }
        
        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text) return;
            
            db.collection('support').doc(userCode).collection('messages').add({
                text: text,
                sender: 'user', // user means student
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = '';
        }

        function loadMessages() {
            const chatBody = document.getElementById('chatBody');
            db.collection('support').doc(userCode).collection('messages')
            .orderBy('createdAt', 'asc')
            .onSnapshot(snapshot => {
                chatBody.innerHTML = '';
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = `msg ${msg.sender}`;
                    div.innerText = msg.text;
                    chatBody.appendChild(div);
                });
                chatBody.scrollTop = chatBody.scrollHeight; // Auto scroll down
            });
        }

        // --- البروفايل ---
        function openProfile() {
            document.getElementById('profileModal').style.display = 'flex';
            db.collection('codes').where('code', '==', userCode).get().then(snap => {
                if(!snap.empty) {
                    const d = snap.docs[0].data();
                    document.getElementById('pName').innerText = d.studentName;
                    document.getElementById('pCode').innerText = d.code;
                    document.getElementById('pExp').innerText = "ينتهي في: " + d.expiresAt.toDate().toLocaleDateString('ar-EG');
                }
            });
        }
        function closeProfile() { document.getElementById('profileModal').style.display = 'none'; }

        // --- عرض المحتوى ---
        function renderSubjects() {
            state.level = 'subjects'; document.getElementById('backBtn').style.display='none'; 
            document.getElementById('sectionTitle').innerText = "المواد الدراسية"; content.className = "grid-container";
            content.innerHTML = platformData.map((sub, i) => `
                <div class="card" onclick="renderTeachers(${i})">
                    <img src="${sub.image}" class="card-img" onerror="this.src='https://placehold.co/400x300/111/FFF?text=${sub.name}'">
                    <div class="card-body">${sub.name}</div>
                </div>
            `).join('');
        }

        function renderTeachers(i) {
            state.level = 'teachers'; state.subIdx = i;
            document.getElementById('backBtn').style.display='inline-block';
            const sub = platformData[i];
            document.getElementById('sectionTitle').innerText = "مدرسين " + sub.name;
            content.innerHTML = sub.teachers.length ? sub.teachers.map((t, idx) => `
                <div class="card" onclick="renderFolders(${idx})">
                    <img src="${t.image}" class="card-img" onerror="this.src='https://placehold.co/300x300/111/FFF?text=Teacher'">
                    <div class="card-body">${t.name}</div>
                </div>
            `).join('') : '<p style="text-align:center; color:white; width:100%;">قريباً...</p>';
        }

        function renderFolders(i) {
            state.level = 'folders'; state.techIdx = i;
            const teacher = platformData[state.subIdx].teachers[i];
            document.getElementById('sectionTitle').innerText = "كورسات " + teacher.name;
            content.innerHTML = teacher.folders.length ? teacher.folders.map((f, idx) => `
                <div class="card" onclick="renderVideos(${idx})">
                    <img src="https://cdn-icons-png.flaticon.com/512/3767/3767084.png" class="card-img" style="object-fit:contain; padding:20px;">
                    <div class="card-body">${f.title}</div>
                </div>
            `).join('') : '<p style="text-align:center; color:white; width:100%;">لا يوجد كورسات</p>';
        }
        
        // باقي دوال الفيديو والرجوع زي ما هي...
        function renderVideos(fIdx) {
            // (نفس كود الفيديو السابق)
            const folder = platformData[state.subIdx].teachers[state.techIdx].folders[fIdx];
            content.className = '';
            content.innerHTML = folder.videos.map(v => `
                <div class="video-wrapper" style="max-width:800px; margin:0 auto 20px; background:#111; border-radius:10px; overflow:hidden;">
                    <div class="plyr__video-embed"><iframe src="https://www.youtube.com/embed/${v.vid}?origin=https://plyr.io&iv_load_policy=3&modestbranding=1&rel=0" allowfullscreen allow="autoplay"></iframe></div>
                    <div style="padding:15px;"><h3 style="color:var(--main)">${v.title}</h3></div>
                </div>
            `).join('');
            Plyr.setup('.plyr__video-embed');
        }

        function goBack() {
            if(state.level==='folders') renderTeachers(state.subIdx);
            else if(state.level==='teachers') renderSubjects();
            else renderSubjects();
        }
        function logout() { localStorage.removeItem('fullmark_user'); window.location.href="login.html"; }

        renderSubjects();
    </script>
</body>
</html>
