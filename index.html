    <style>
        /* --- الثيم الأزرق النيون (Dark Ice) --- */
        :root { --main: #00e1ff; --bg: #02050a; --card-bg: #0a0f18; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; padding-bottom: 50px; }
        
        /* الخلفية */
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(10, 15, 24, 0.95); border-bottom: 2px solid var(--main);
            padding: 10px 20px; border-radius: 20px; margin-bottom: 25px; 
            box-shadow: 0 0 25px rgba(0, 225, 255, 0.15); backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.6rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.7); }
        
        .header-icons { display: flex; gap: 10px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0, 225, 255, 0.3);
            background: rgba(0,0,0,0.5); color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .icon-btn:active { background: var(--main); color: #000; box-shadow: 0 0 20px var(--main); transform: scale(0.95); }
        .logout-btn { color: #ff4444; border-color: #ff4444; }

        /* شريط العنوان */
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { font-size: 1.4rem; color: var(--main); border-right: 4px solid var(--main); padding-right: 12px; margin: 0; }
        #backBtn { 
            display: none; background: transparent; color: var(--main); border: 2px solid var(--main); 
            padding: 6px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }

        /* الشبكة (Grid) - مظبوطة للموبايل 2 جنب بعض */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* عمودين للموبايل */
            gap: 15px; 
        }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; } }

        .card { 
            background: var(--card-bg); border: 1px solid rgba(0, 225, 255, 0.15); border-radius: 15px; 
            overflow: hidden; cursor: pointer; transition: 0.3s; position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .card:active { transform: scale(0.97); border-color: var(--main); }
        
        .card-img-container { width: 100%; height: 140px; position: relative; background: #000; }
        @media(min-width: 768px) { .card-img-container { height: 180px; } }
        
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .img-fallback { 
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(45deg, #0a0f18, #161b22); color: var(--main); 
            flex-direction: column; padding: 10px; text-align: center;
        }
        .img-fallback i { font-size: 2.5rem; margin-bottom: 8px; opacity: 0.7; }
        .img-fallback span { font-size: 0.9rem; font-weight: bold; color: #fff; }

        .card-title { 
            padding: 12px; text-align: center; font-weight: bold; font-size: 1rem; 
            color: #fff; background: #0f121a; border-top: 1px solid rgba(255,255,255,0.1); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* الفيديو */
        .video-list { display: flex; flex-direction: column; gap: 20px; }
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        .video-header { padding: 15px; background: #111; color: var(--main); font-weight: bold; font-size: 1rem; border-bottom: 1px solid #333; }

        /* المودال */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #0f121a; border: 1px solid var(--main); padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; position: relative; box-shadow: 0 0 40px rgba(0, 225, 255, 0.2); }
        .close { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 22px; cursor: pointer; }
        
        .profile-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--main); margin-bottom: 15px; padding: 3px; }
        .user-info div { margin-bottom: 8px; font-size: 1.1rem; color: #ccc; }
        .user-info span { color: var(--main); font-weight: bold; font-family: monospace; }
    </style>
</head>
