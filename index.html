<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Mark | المنصة</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --main: #00e1ff; --bg: #000000; --card: #0a0a0a; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        /* ⚠️ إصلاح الخلفية: z-index بالسالب عشان ترجع ورا */
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        
        .container { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* الهيدر */
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(20,20,20,0.9); border-bottom: 2px solid var(--main);
            padding: 15px 20px; border-radius: 20px; margin-bottom: 30px; 
            backdrop-filter: blur(10px);
        }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--main); text-transform: uppercase; text-shadow: 0 0 15px rgba(0, 225, 255, 0.6); }
        
        .header-icons { display: flex; gap: 10px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%; border: 1px solid #444; 
            background: #000; color: #fff; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .icon-btn:hover { background: var(--main); color: #000; transform: scale(1.1); }
        .icon-btn.logout { color: #f00; border-color: #f00; }

        /* الشبكة */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; } }

        .card { 
            background: #0f1015; border: 1px solid #222; border-radius: 20px; overflow: hidden; 
            position: relative; transition: 0.4s; cursor: pointer;
        }
        .card:active { transform: scale(0.95); }
        .card:hover { transform: translateY(-7px); border-color: var(--main); box-shadow: 0 0 20px rgba(0, 225, 255, 0.2); }
        
        .card-img-container { width: 100%; height: 180px; position: relative; background: #000; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; opacity: 0; } 
        .card-img.loaded { opacity: 1; }
        
        .img-fallback {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            background: #111; color: var(--main); font-weight: bold; padding: 10px; text-align: center;
        }
        .img-fallback i { font-size: 3rem; margin-bottom: 10px; color: #333; }

        .card-title { 
            padding: 15px; text-align: center; font-weight: 800; font-size: 1rem; 
            background: #0a0a0a; border-top: 1px solid #222; color: #fff;
        }

        /* الفيديو */
        .video-wrapper { background: #000; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .video-header { padding: 15px; background: #111; color: var(--main); font-weight: bold; }

        /* التنقل */
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        h2 { border-right: 5px solid var(--main); padding-right: 15px; font-size: 1.5rem; margin: 0; color: #fff; }
        #backBtn { display: none; background: #222; color: #fff; border: 1px solid #444; padding: 8px 25px; border-radius: 50px; cursor: pointer; }

        /* رسالة الخطأ لو الشاشة سوداء */
        #debugMsg { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(255,0,0,0.9); color: white; padding: 20px; border-radius: 10px; text-align: center; z-index: 99999; 
        }
    </style>
</head>

            if(!userCode) {

                // لكن عشان متسودش، هنكتب رسالة في الكونسول حالياً
                console.log("No user code found, redirecting...");
                window.location.href = "login.html";
            }

            const grid = document.getElementById('gridArea');
            const title = document.getElementById('pageTitle');
            const back = document.getElementById('backBtn');
            let viewStack = [];

            function createCard(title, imgUrl, onclickFn, icon) {
                return `
                <div class="card" onclick="${onclickFn}">
                    <div class="card-img-container">
                        <div class="img-fallback"><i class="fas ${icon}"></i><br>${title}</div>
                        <img src="${imgUrl}" class="card-img" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
                    </div>
                    <div class="card-title">${title}</div>
                </div>`;
            }

            // 1. عرض المواد
            function renderSubjects() {
                title.innerText = "المواد الدراسية";
                back.style.display = 'none';
                grid.className = 'grid';
                viewStack = [{type: 'subjects'}];
                
                grid.innerHTML = ALL_DATA.map((sub, i) => createCard(sub.subject_name, sub.image_url, `renderTeachers(${i})`, 'fa-book')).join('');
            }

            // 2. عرض المدرسين
            window.renderTeachers = function(subIdx) {
                const sub = ALL_DATA[subIdx];
                title.innerText = sub.subject_name;
                back.style.display = 'block';
                viewStack.push({type: 'teachers', subIdx});
                
                if(!sub.teachers || sub.teachers.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; width:100%; color:#aaa;">قريباً</p>';
                    return;
                }
                grid.innerHTML = sub.teachers.map((t, i) => createCard(t.name, t.image_url, `renderChapters(${subIdx}, ${i})`, 'fa-chalkboard-teacher')).join('');
            }

            // 3. عرض الفصول
            window.renderChapters = function(subIdx, techIdx) {
                const teacher = ALL_DATA[subIdx].teachers[techIdx];
                title.innerText = teacher.name;
                viewStack.push({type: 'chapters', subIdx, techIdx});
                
                if(!teacher.chapters || teacher.chapters.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; width:100%; color:#aaa;">لا يوجد محتوى حالياً</p>';
                    return;
                }
                grid.innerHTML = teacher.chapters.map((c, i) => createCard(c.chapter_name, '', `renderLectures(${subIdx}, ${techIdx}, ${i})`, 'fa-folder')).join('');
            }

            // 4. عرض المحاضرات
            window.renderLectures = function(subIdx, techIdx, chapIdx) {
                const chapter = ALL_DATA[subIdx].teachers[techIdx].chapters[chapIdx];
                title.innerText = chapter.chapter_name;
                viewStack.push({type: 'lectures', subIdx, techIdx, chapIdx});
                
                grid.innerHTML = chapter.lectures.map((l, i) => createCard(l.lecture_name, '', `renderVideos(${subIdx}, ${techIdx}, ${chapIdx}, ${i})`, 'fa-video')).join('');
            }

            // 5. عرض الفيديو
            window.renderVideos = function(subIdx, techIdx, chapIdx, lectIdx) {
                const lecture = ALL_DATA[subIdx].teachers[techIdx].chapters[chapIdx].lectures[lectIdx];
                title.innerText = lecture.lecture_name;
                grid.className = '';
                viewStack.push({type: 'videos'});

                grid.innerHTML = lecture.videos.map((v, i) => `
                    <div class="video-wrapper">
                        <div class="video-header">${v.video_name}</div>
                        <div class="plyr__video-embed" id="player-wrap-${i}">
                            <video id="player-${i}" controls crossorigin playsinline style="width:100%"></video>
                        </div>
                    </div>
                `).join('');

                setTimeout(() => {
                    lecture.videos.forEach((v, i) => {
                        const video
